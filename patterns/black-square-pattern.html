<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Square Grid Pattern</title>
    <style>
        /* Ensure the page itself takes up the full screen */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #111111; /* Fallback color */
        }

        .container {
            width: 100%;
            height: 100vh; /* Fills the entire browser window */
            
            /* Creating the square grid */
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            
            /* This defines the size of each square (60px by 60px) */
            background-size: 60px 60px;
            
            /* Optional: Shift the grid slightly */
            background-position: center;
        }
    </style>
</head>
<body>

    <div class="container"></div>

</body>
</html>
