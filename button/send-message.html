<!DOCTYPE html>
<html lang="en">
<head>
    <title>Premium Fly-Away Button</title>
</head>
<style>
/* Centering and Background */
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #000; /* Deep black */
}

.button {
  --primary: #ff5569;
  --neutral-1: #f7f8f7;
  --neutral-2: #e7e7e7;
  --radius: 14px;

  cursor: pointer;
  border-radius: var(--radius);
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
  border: none;
  /* Enhanced shadow for black background */
  box-shadow: 0 0.5px 0.5px 1px rgba(255, 255, 255, 0.1),
    0 10px 20px rgba(0, 0, 0, 0.5), 0 4px 5px 0px rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.3s ease;
  min-width: 200px;
  padding: 20px;
  height: 68px;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 18px;
  font-weight: 600;
  background: transparent;
}

.button:hover {
  transform: scale(1.02);
  /* Added a subtle red glow on hover to match the primary color */
  box-shadow: 0 0 1px 2px rgba(255, 85, 105, 0.2),
    0 15px 30px rgba(0, 0, 0, 0.6);
}

.button:active {
  transform: scale(0.98);
}

.button:after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  border: 2.5px solid transparent;
  background: linear-gradient(var(--neutral-1), var(--neutral-2)) padding-box,
    linear-gradient(to bottom, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.5)) border-box;
  z-index: 0;
  transition: all 0.4s ease;
}

.button:hover::after {
  transform: scale(1.05, 1.1);
}

.button::before {
  content: "";
  inset: 7px 6px 6px 6px;
  position: absolute;
  background: linear-gradient(to top, var(--neutral-1), var(--neutral-2));
  border-radius: 30px;
  filter: blur(0.5px);
  z-index: 2;
}

/* Plane Contrail - Made it pop more on black */
@keyframes contrail {
  0% { width: 0; opacity: 1; }
  8% { width: 15px; }
  60% { opacity: 0.7; width: 80px; background: linear-gradient(to right, transparent, var(--primary)); }
  100% { opacity: 0; width: 160px; }
}

/* Outline - The "Spinning" light border */
.outline {
  position: absolute;
  border-radius: inherit;
  overflow: hidden;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.4s ease;
  inset: -2px -3.5px;
}

.outline::before {
  content: "";
  position: absolute;
  inset: -100%;
  background: conic-gradient(
    from 180deg,
    transparent 60%,
    var(--primary) 80%,
    transparent 100%
  );
  animation: spin 2s linear infinite;
  animation-play-state: paused;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.button:hover .outline {
  opacity: 1;
}

.button:hover .outline::before {
  animation-play-state: running;
}

/* Text Animations */
.state p {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  color: #333; /* Darker text for contrast against the light button body */
}

.state p span {
  display: block;
  opacity: 0;
  animation: slideDown 0.8s ease forwards calc(var(--i) * 0.03s);
}

@keyframes wave {
  30% { transform: translateY(4px); }
  50% { transform: translateY(-3px); color: var(--primary); }
  100% { opacity: 1; transform: translateY(0); color: #000; }
}

/* Standard fly-away and land logic preserved */
.state .icon {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  margin: auto;
  transform: scale(1.25);
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
}

.state--default svg { animation: land 0.6s ease forwards; }
.button:hover .state--default .icon { transform: rotate(45deg) scale(1.25); color: var(--primary); }
.button:focus .state--default svg { animation: takeOff 0.8s linear forwards; }

@keyframes takeOff {
  0% { opacity: 1; }
  60% { opacity: 1; transform: translateX(70px) rotate(45deg) scale(2); }
  100% { opacity: 0; transform: translateX(160px) rotate(45deg) scale(0); }
}

/* States Display */
.state {
  padding-left: 29px;
  z-index: 2;
  display: flex;
  position: relative;
}

.state--sent { display: none; color: #000; }
.button:focus .state--default { position: absolute; }
.button:focus .state--sent { display: flex; }

.button:focus .state--sent span {
  opacity: 0;
  animation: slideDown 0.8s ease forwards calc(var(--i) * 0.2s);
}

.button:focus .state--sent .icon svg {
  opacity: 0;
  animation: appear 1.2s ease forwards 0.8s;
  color: var(--primary);
}

@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-20px) rotate(-90deg); filter: blur(5px); }
  100% { opacity: 1; transform: translateY(0) rotate(0); filter: blur(0); }
}

@keyframes appear {
  0% { opacity: 0; transform: scale(4) rotate(-40deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

/* Letter Spacing adjustment for "Send Message" */
.state--default span:nth-child(4) {
  margin-right: 6px;
}
</style>
<body>

<button class="button">
  <div class="outline"></div>
  <div class="state state--default">
    <div class="icon">
      <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M10.11 14.4C9.92005 14.4 9.73005 14.33 9.58005 14.18C9.29005 13.89 9.29005 13.41 9.58005 13.12L13.16 9.53C13.45 9.24 13.93 9.24 14.22 9.53C14.51 9.82 14.51 10.3 14.22 10.59L10.64 14.18C10.5 14.33 10.3 14.4 10.11 14.4Z" fill="currentColor"></path>
      </svg>
    </div>
    <p>
      <span style="--i:0">S</span><span style="--i:1">e</span><span style="--i:2">n</span><span style="--i:3">d</span>
      <span style="--i:4">M</span><span style="--i:5">e</span><span style="--i:6">s</span><span style="--i:7">s</span><span style="--i:8">a</span><span style="--i:9">g</span><span style="--i:10">e</span>
    </p>
  </div>
  <div class="state state--sent">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="1em" width="1em">
        <path fill="currentColor" d="M12 22.75C6.07 22.75 1.25 17.93 1.25 12C1.25 6.07 6.07 1.25 12 1.25C17.93 1.25 22.75 6.07 22.75 12C22.75 17.93 17.93 22.75 12 22.75ZM12 2.75C6.9 2.75 2.75 6.9 2.75 12C2.75 17.1 6.9 21.25 12 21.25C17.1 21.25 21.25 17.1 21.25 12C21.25 6.9 17.1 2.75 12 2.75Z"></path>
        <path fill="currentColor" d="M10.5795 15.5801C10.3795 15.5801 10.1895 15.5001 10.0495 15.3601L7.21945 12.5301C6.92945 12.2401 6.92945 11.7601 7.21945 11.4701C7.50945 11.1801 7.98945 11.1801 8.27945 11.4701L10.5795 13.7701L15.7195 8.6301C16.0095 8.3401 16.4895 8.3401 16.7795 8.6301C17.0695 8.9201 17.0695 9.4001 16.7795 9.6901L11.1095 15.3601C10.9695 15.5001 10.7795 15.5801 10.5795 15.5801Z"></path>
      </svg>
    </div>
    <p>
      <span style="--i:5">S</span><span style="--i:6">e</span><span style="--i:7">n</span><span style="--i:8">t</span>
    </p>
  </div>
</button>

</body>
</html>
