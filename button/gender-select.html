<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Gender Selection</title>
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
      --card: #ffffff;
      --border: #e2e8f0;
      --ring: #2563eb;
      --male: #3b82f6;
      --female: #ec4899;
      --nb: #8b5cf6;
      --none: #9ca3af;
    }

    * { box-sizing: border-box; }

    /* UNIFORM CENTERING METHOD */
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
      color: var(--text);
      background: #f8fafc;
      /* Flexbox Centering */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px; /* Prevents card from hitting screen edges */
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(2, 6, 23, .06);
      padding: 24px;
    }

    fieldset { border: 0; margin: 0; padding: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; } /* Stack on very small screens */
    }

    /* Option Styling */
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      transition: all .15s ease;
      cursor: pointer;
      min-height: 64px;
      position: relative;
    }

    .option:hover { border-color: #cbd5e1; }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .dot {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: #f1f5f9;
      border: 1px solid var(--border);
      flex: 0 0 40px;
    }

    .dot svg { width: 22px; height: 22px; }

    .label { display: flex; flex-direction: column; line-height: 1.2; }
    .label .title { font-size: 14px; font-weight: 600; }

    /* Color accents */
    .male .dot { background: #eff6ff; border-color: #bfdbfe; }
    .male .dot svg { stroke: var(--male); fill: none; }
    .female .dot { background: #fdf2f8; border-color: #fbcfe8; }
    .female .dot svg { fill: var(--female); }
    .nb .dot { background: #f5f3ff; border-color: #ddd6fe; }
    .nb .dot svg { fill: var(--nb); }
    .none .dot { background: #f5f5f5; border-color: #e5e7eb; }
    .none .dot svg { stroke: var(--none); fill: none; }

    /* Selected state */
    .option:has(input:checked) {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      background-color: #f8fafc;
    }
  </style>
</head>
<body>



<div class="card">
  <form>
    <fieldset>
      <div class="grid" role="radiogroup" aria-label="Gender">
        <label class="option male">
          <input type="radio" name="gender" value="male" />
          <span class="dot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5631 16.1199C14.871 16.81 13.9885 17.2774 13.0288 17.462C12.0617 17.6492 11.0607 17.5459 10.1523 17.165C8.29113 16.3858 7.07347 14.5723 7.05656 12.5547C7.04683 11.0715 7.70821 9.66348 8.8559 8.72397C10.0036 7.78445 11.5145 7.4142 12.9666 7.71668C13.9237 7.9338 14.7953 8.42902 15.4718 9.14008C16.4206 10.0503 16.9696 11.2996 16.9985 12.6141C17.008 13.9276 16.491 15.1903 15.5631 16.1199Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
          <span class="label"><span class="title">Male</span></span>
        </label>

        <label class="option female">
          <input type="radio" name="gender" value="female" />
          <span class="dot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 9C20 13.0803 16.9453 16.4471 12.9981 16.9383C12.9994 16.9587 13 16.9793 13 17V19H14C14.5523 19 15 19.4477 15 20C15 20.5523 14.5523 21 14 21H13V22C13 22.5523 12.5523 23 12 23C11.4477 23 11 22.5523 11 22V21H10C9.44772 21 9 20.5523 9 20C9 19.4477 9.44772 19 10 19H11V17C11 16.9793 11.0006 16.9587 11.0019 16.9383C7.05466 16.4471 4 13.0803 4 9C4 4.58172 7.58172 1 12 1C16.4183 1 20 4.58172 20 9Z"/></svg></span>
          <span class="label"><span class="title">Female</span></span>
        </label>

        <label class="option nb">
          <input type="radio" name="gender" value="non-binary" />
          <span class="dot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M226.597,200.834611 L296.853333,271.084945 L353.819,271.084 L326.248389,243.503223 L356.418278,213.333333 L435.503223,292.418278 L356.418278,371.503223 L326.248389,341.333333 L353.82,313.751 L279.163435,313.751611 L196.418,231.011611 L226.597,200.834611 Z"/></svg></span>
          <span class="label"><span class="title">Non-binary</span></span>
        </label>

        <label class="option none">
          <input type="radio" name="gender" value="none" />
          <span class="dot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8.19531 8.76498C8.42304 8.06326 8.84053 7.43829 9.40137 6.95899C12.1017 5.9338 12.8486 6.02202 13.5303 6.3042C15.9295 8.95008 15.9875 10.421 15.5636 11.8154C13.4611 13.7961 12.7377 14.0002 12 14.0002V14.9998" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span class="label"><span class="title">Private</span></span>
        </label>
      </div>
    </fieldset>
  </form>
</div>

</body>
</html>
