<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Power Button Animation - Dark Theme</title>
    <style>
        /* 1. Centering and Dark Theme Background */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a; /* Deep dark background */
        }

        /* Hide the default checkbox */
        .container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .container {
            display: block;
            position: relative;
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }

        /* Create a custom checkbox - Dark Neumorphism */
        .checkmark {
            position: relative;
            height: 80px;
            width: 80px;
            border-radius: 50%;
            background-color: #212121;
            transition: 0.3s ease;
            /* Outer shadows: bottom-right (darker) and top-left (lighter) */
            box-shadow: 8px 8px 15px #0b0b0b, 
                        -8px -8px 15px #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkmark svg {
            width: 40px;
            height: 40px;
            fill: #444; /* Dim color for 'off' state */
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Active click effect (pressing down) */
        .checkmark:active {
            box-shadow: 3px 3px 5px #0b0b0b, 
                        -3px -3px 5px #2d2d2d;
            transform: scale(0.95);
        }

        /* When the checkbox is checked (On State) */
        .container input:checked ~ .checkmark {
            box-shadow: 4px 4px 10px #0b0b0b, 
                        -4px -4px 10px #2d2d2d;
        }

        .container input:checked ~ .checkmark svg {
            fill: #00ff7b;
            /* Subtle neon glow */
            filter: drop-shadow(0 0 8px rgba(0, 255, 123, 0.6));
            transform: scale(1.1);
        }

        .container input:checked ~ .checkmark:active {
            box-shadow: inset 2px 2px 5px #0b0b0b, 
                        inset -2px -2px 5px #2d2d2d;
        }

    </style>
</head>
<body>

<label class="container">
  <input type="checkbox" />
  <div class="checkmark">
    <svg
      version="1.1"
      id="Capa_1"

      viewBox="0 0 49.548 49.549"
    >

          c0,12.639,10.281,22.92,22.919,22.92s22.92-10.281,22.92-22.92C47.694,15.865,40.224,6.835,30.203,4.387z"></path>
        <path d="M24.776,27.225c-1.41,0-2.554-1.145-2.554-2.555V2.554c0-1.41,1.144-2.554,2.554-2.554c1.41,0,2.554,1.144,2.554,2.554
          V24.67C27.33,26.08,26.186,27.225,24.776,27.225z"></path>
      </g>
    </svg>
  </div>
</label>

</body>
</html>
