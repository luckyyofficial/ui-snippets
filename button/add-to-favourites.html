<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Favorite Button</title>
</head>
<style>
/* Centering Logic and Black Background */
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #000; /* Pitch black background */
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

label {
  /* Glassmorphism effect */
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  cursor: pointer;
  user-select: none;
  border-radius: 14px;
  color: #efefef;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}

label:hover {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.2);
}

input {
  display: none;
}

/* Heart Animation & Styling */
label svg {
  fill: transparent;
  stroke: #999;
  transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

input:checked + label {
  background: rgba(255, 0, 0, 0.05);
  border-color: rgba(255, 0, 0, 0.2);
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
}

input:checked + label svg {
  fill: #ff3e3e;
  stroke: #ff3e3e;
  filter: drop-shadow(0 0 8px rgba(255, 62, 62, 0.5));
  animation: heartPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes heartPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

/* Smooth Text Sliding Logic */
.action {
  position: relative;
  overflow: hidden;
  display: grid;
  height: 24px; /* Matches icon height */
  align-items: center;
}

.action span {
  grid-area: 1 / 1; /* Stacks spans on top of each other */
  transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1), 
              opacity 0.4s ease;
  font-weight: 500;
  font-size: 15px;
}

.option-1 {
  opacity: 1;
  transform: translateY(0);
}

input:checked + label .option-1 {
  opacity: 0;
  transform: translateY(-100%);
}

.option-2 {
  opacity: 0;
  transform: translateY(100%);
  color: #ff7e7e; /* Slightly lighter red for the text */
}

input:checked + label .option-2 {
  opacity: 1;
  transform: translateY(0);
}

</style>
<body>
     
<input type="checkbox" id="favorite" name="favorite-checkbox" value="favorite-button">
<label for="favorite" class="container">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
  </svg>
  <div class="action">
    <span class="option-1">Add to Favorites</span>
    <span class="option-2">Added to Favorites</span>
  </div>
</label>

</body>
</html>
