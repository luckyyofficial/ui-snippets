<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Button - Modern Light</title>
    <style>
        /* 1. Centering & Page Setup */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fcfcfd; /* Clean, modern off-white */
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px); /* Subtle grid pattern */
            background-size: 20px 20px;
        }

        /* 2. The Button Styling */
        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 24px;
            gap: 10px;
            height: 48px;
            border: 1px solid rgba(94, 65, 222, 0.1);
            background: rgba(94, 65, 222, 0.08); /* Soft translucent purple */
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* 3. Text Styling */
        .label {
            line-height: 1;
            font-size: 16px;
            color: #5d41de;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* 4. Icon & Animation */
        .svg-icon {
            transition: transform 0.3s ease;
            display: block; /* Prevents alignment issues */
        }

        .button:hover {
            background: rgba(94, 65, 222, 0.15);
            border-color: rgba(94, 65, 222, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(94, 65, 222, 0.3);
        }

        /* The spin only triggers on hover */
        .button:hover .svg-icon {
            animation: spin 3s linear infinite;
        }

        .button:active {
            transform: translateY(0);
            background: rgba(94, 65, 222, 0.2);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive - make button wider on small mobile if needed */
        @media (max-width: 480px) {
            .button {
                width: 160px;
            }
        }
    </style>
</head>
<body>
    
<button class="button">
  <svg 
    xmlns="http://www.w3.org/2000/svg"

</button>

</html>
