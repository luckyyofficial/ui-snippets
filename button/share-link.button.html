<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Share Link Button</title>
    <style>
        /* --- Page Centering Styles --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center;     /* Center vertically */
            min-height: 100vh;       /* Full viewport height */
            background-color: #f8f9fa; /* Light neutral background */
            font-family: "Arial", sans-serif;
        }

        /* --- Container Styles --- */
        .tooltip-container {
            position: relative;
            display: inline-block;
            overflow: visible;
        }

        /* --- Button Styles --- */
        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            transition:
                background 0.4s cubic-bezier(0.25, 0.8, 0.25, 1),
                transform 0.3s ease,
                box-shadow 0.4s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            overflow: hidden;
            border: none;
            outline: none;
        }

        .button-content::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0) 70%
            );
            transform: scale(0);
            transition: transform 0.6s ease-out;
            z-index: -1;
        }

        .button-content:hover {
            background: linear-gradient(135deg, #a777e3, #6e8efb);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            transform: translateY(-4px) scale(1.03);
        }

        .button-content:hover::after {
            transform: scale(1);
        }

        .button-content:active {
            transform: translateY(-2px) scale(0.98);
        }

        .text {
            font-size: 18px;
            font-weight: 600;
            margin-right: 12px;
            white-space: nowrap;
            transition: letter-spacing 0.3s ease;
        }

        .button-content:hover .text {
            letter-spacing: 1px;
        }

        .share-icon {
            fill: white;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .button-content:hover .share-icon {
            transform: rotate(180deg) scale(1.1);
        }

        /* --- Tooltip Styles --- */
        .tooltip-content {
            position: absolute;
            top: 110%; /* Spaced slightly further down */
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transition:
                opacity 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .tooltip-container:hover .tooltip-content {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }

        /* --- Social Icons --- */
        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f0f0f0;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: #333;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-5px);
        }

        .social-icon:hover svg {
            fill: white;
        }

        .social-icon.twitter:hover { background: #1da1f2; }
        .social-icon.facebook:hover { background: #1877f2; }
        .social-icon.linkedin:hover { background: #0077b5; }

        /* --- Tooltip Arrow --- */
        .tooltip-content::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent white transparent;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(110, 142, 251, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(110, 142, 251, 0); }
            100% { box-shadow: 0 0 0 0 rgba(110, 142, 251, 0); }
        }

        .button-content {
            animation: pulse 3s infinite;
        }

        /* --- Dark Mode Support --- */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; }
            .tooltip-content {
                background: rgba(30, 30, 30, 0.95);
                color: white;
            }
            .tooltip-content::before { border-color: transparent transparent #1e1e1e transparent; }
            .social-icon { background: #2a2a2a; }
            .social-icon svg { fill: #eee; }
        }
    </style>
</head>
<body>

<div class="tooltip-container">
    <div class="button-content" tabindex="0">

</div>
