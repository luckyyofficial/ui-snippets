<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in Button - Light Theme</title>
    <style>
        /* Centering the button on the page */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8fafc; /* Very light blue/grey background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .user-profile {
            width: 131px;
            height: 51px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s ease;
            /* Lighter gradient for the border effect */
            background: linear-gradient(
                to bottom right,
                #2e8eff 0%,
                rgba(46, 142, 255, 0) 40%
            );
            background-color: rgba(46, 142, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-profile:hover,
        .user-profile:focus {
            background-color: rgba(46, 142, 255, 0.3);
            box-shadow: 0 4px 12px rgba(46, 142, 255, 0.2);
            outline: none;
            transform: translateY(-1px);
        }

        .user-profile-inner {
            width: 127px;
            height: 47px;
            border-radius: 13px;
            background-color: #ffffff; /* Pure white background */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #2e8eff; /* Blue text for light theme */
            font-weight: 600;
            font-size: 15px;
        }

        .user-profile-inner svg {
            width: 24px;
            height: 24px;
            fill: #2e8eff; /* Blue icon to match text */
        }

        p {
            margin: 0;
        }

    </style>
</head>
<body>

<div
    aria-label="User Login Button"
    tabindex="0"
    role="button"
    class="user-profile"
>
    <div class="user-profile-inner">
        <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
        >
            <g data-name="Layer 2" id="Layer_2">
                <path
                    d="m15.626 11.769a6 6 0 1 0 -7.252 0 9.008 9.008 0 0 0 -5.374 8.231 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 9.008 9.008 0 0 0 -5.374-8.231zm-7.626-4.769a4 4 0 1 1 4 4 4 4 0 0 1 -4-4zm10 14h-12a1 1 0 0 1 -1-1 7 7 0 0 1 14 0 1 1 0 0 1 -1 1z"
                ></path>
            </g>
        </svg>
        <p>Log In</p>
    </div>
</div>

</body>
</html>
