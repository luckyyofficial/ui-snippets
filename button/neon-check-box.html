<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Check Box</title>
</head>
<style>
/* Centering and Background */
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #000; /* Deep black background */
  overflow: hidden;
}

.checkbox-wrapper {
  --checkbox-size: 25px;
  --checkbox-color: #00ff88;
  --checkbox-shadow: rgba(0, 255, 136, 0.4);
  --checkbox-border: rgba(0, 255, 136, 0.5);
  display: flex;
  align-items: center;
  position: relative;
  cursor: pointer;
  padding: 15px 25px;
  background: rgba(255, 255, 255, 0.03); /* Subtle glass container */
  border-radius: 12px;
  transition: all 0.3s ease;
}

.checkbox-wrapper input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.checkbox-wrapper .checkmark {
  position: relative;
  width: var(--checkbox-size);
  height: var(--checkbox-size);
  border: 2px solid var(--checkbox-border);
  border-radius: 8px;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0a0a0a;
  box-shadow: 0 0 10px var(--checkbox-shadow);
  overflow: hidden;
}

.checkbox-wrapper .checkmark::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, var(--checkbox-color), #00ffcc);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform: scale(0) rotate(-45deg);
}

.checkbox-wrapper input:checked ~ .checkmark::before {
  opacity: 1;
  transform: scale(1) rotate(0);
}

.checkbox-wrapper .checkmark svg {
  width: 0;
  height: 0;
  color: #000; /* High contrast black checkmark on green bg */
  z-index: 1;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.checkbox-wrapper input:checked ~ .checkmark svg {
  width: 18px;
  height: 18px;
  transform: rotate(360deg);
}

.checkbox-wrapper:hover .checkmark {
  border-color: var(--checkbox-color);
  transform: scale(1.1);
  box-shadow: 
    0 0 20px var(--checkbox-shadow),
    inset 0 0 8px var(--checkbox-shadow);
}

.checkbox-wrapper input:checked ~ .checkmark {
  animation: pulse 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  border-color: var(--checkbox-color);
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(0.9); box-shadow: 0 0 40px var(--checkbox-color); }
  100% { transform: scale(1); }
}

.checkbox-wrapper .label {
  margin-left: 15px;
  font-family: "Segoe UI", sans-serif;
  color: #fff; /* White text for better readability */
  font-size: 18px;
  font-weight: 500;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}

.checkbox-wrapper:hover .label {
  color: var(--checkbox-color);
  text-shadow: 0 0 12px var(--checkbox-shadow);
  transform: translateX(5px);
}

/* Glowing side-dots */
.checkbox-wrapper::after,
.checkbox-wrapper::before {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--checkbox-color);
  opacity: 0;
  transition: all 0.5s;
}

.checkbox-wrapper::before { left: 0; top: 50%; transform: translateY(-50%); }
.checkbox-wrapper::after { right: 0; top: 50%; transform: translateY(-50%); }

.checkbox-wrapper:hover::before {
  opacity: 1;
  left: 8px;
  box-shadow: 0 0 10px var(--checkbox-color);
}

.checkbox-wrapper:hover::after {
  opacity: 1;
  right: 8px;
  box-shadow: 0 0 10px var(--checkbox-color);
}

/* Added a subtle background glow for the whole component */
.checkbox-wrapper:hover {
  background: rgba(0, 255, 136, 0.05);
  box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
}
</style>
<body>
    
<label class="checkbox-wrapper">
  <input type="checkbox" />
  <div class="checkmark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path
        d="M20 6L9 17L4 12"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
  </div>
  <span class="label">Neon Checkbox</span>
</label>

</body>
</html>
