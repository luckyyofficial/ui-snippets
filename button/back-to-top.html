<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Back to Top Button</title>
    <style>
        /* Modern Centering Logic */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9; /* Light theme background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgb(20, 20, 20);
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 0px 0px 4px rgba(180, 160, 255, 0.253);
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            overflow: hidden;
            position: relative;
        }

        .svgIcon {
            width: 12px;
            transition-duration: 0.3s;
        }

        .svgIcon path {
            fill: white;
        }

        /* Hover State: Expanding into a pill shape */
        .button:hover {
            width: 140px;
            border-radius: 50px;
            background-color: rgb(181, 160, 255);
        }

        /* Move the arrow out of view on hover */
        .button:hover .svgIcon {
            transform: translateY(-250%);
            transition-duration: 0.3s;
        }

        /* The hidden text */
        .button::before {
            position: absolute;
            content: "Back to Top";
            color: white;
            font-size: 13px;
            opacity: 0;
            bottom: -20px; /* Start below the button */
            transition: all 0.3s ease-in-out;
            white-space: nowrap;
        }

        /* Slide text up and fade in on hover */
        .button:hover::before {
            opacity: 1;
            bottom: 50%;
            transform: translateY(50%); /* Centers text vertically */
        }

        /* Optional: active "click" effect */
        .button:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>
    
<button class="button">
  <svg class="svgIcon" viewBox="0 0 384 512">
    <path
      d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"
    ></path>
  </svg>
</button>

</body>
</html>
