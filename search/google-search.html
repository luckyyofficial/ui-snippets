<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Search</title>
    <style>
        /* ADDED: Centering Logic */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: arial, sans-serif;
        }

        .searchbar {
            display: flex;
            align-items: center;
            height: 44px;
            background: #fff;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            width: 100%;
            max-width: 584px; /* Real Google width */
            padding: 0 14px;
            transition: box-shadow 0.1s;
        }

        /* The signature Google shadow on hover/focus */
        .searchbar:hover, .searchbar:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .searchbar-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .search-icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 10px;
        }

        .search-icon {
            color: #9aa0a6;
            height: 20px;
            width: 20px;
            fill: currentColor;
        }

        .searchbar-input {
            flex: 1;
            background-color: transparent;
            border: none;
            margin: 0;
            padding: 0;
            color: rgba(0, 0, 0, .87);
            outline: none;
            font-size: 16px;
            height: 34px;
        }

        .searchbar-right {
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .voice-search {
            height: 24px;
            width: 24px;
            cursor: pointer;
            padding: 0 8px;
        }

        /* Optional: Google "Lens" icon style placeholder */
        .lens-search {
            height: 24px;
            width: 24px;
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
<div class="searchbar">
    <div class="searchbar-wrapper">
        <div class="search-icon-wrapper">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
            </svg>
        </div>

        <input type="text" class="searchbar-input" maxlength="2048" name="q" autocapitalize="off" autocomplete="off" title="Search" placeholder="Search Google or type a URL">

        <div class="searchbar-right">
            <svg class="voice-search" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path>
                <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
                <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"></path>
                <path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"></path>
            </svg>
        </div>
    </div>
</div>

</body>
</html>
