<!DOCTYPE html>
<html lang="en">
<head>
<title>Premium Search Box</title>

<style>

/* Center + Black Background */
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0;
  background:black;
  overflow:hidden;
}

/* Grid background (better positioning) */
.grid{
  position:absolute;
  width:100%;
  height:100%;
  background-image:
    linear-gradient(#111 1px, transparent 1px),
    linear-gradient(90deg, #111 1px, transparent 1px);
  background-size:20px 20px;
  z-index:-2;
  opacity:0.4;
}

/* Main container */
#poda{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Input */
.input{
  width:320px;
  height:55px;
  border-radius:12px;
  border:none;
  outline:none;
  padding-left:55px;
  padding-right:50px;
  font-size:16px;
  color:white;
  background:#0a0a0a;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.input::placeholder{
  color:#888;
}

/* Glow layers */
.glow, .border{
  position:absolute;
  border-radius:12px;
  pointer-events:none;
}

.glow{
  width:360px;
  height:90px;
  filter:blur(40px);
  background:linear-gradient(90deg,#402fb5,#cf30aa);
  opacity:0.4;
  z-index:-1;
}

.border{
  width:340px;
  height:70px;
  border:1px solid rgba(255,255,255,0.1);
}

/* Icons */
#search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
}

#filter-icon{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:#111;
  padding:6px;
  border-radius:8px;
  border:1px solid #222;
}

/* Hover effect */
#poda:hover .glow{
  opacity:0.7;
}

/* Focus effect */
#poda:focus-within .glow{
  background:linear-gradient(90deg,#5f4bff,#ff4bd8);
  opacity:1;
}

</style>
</head>

<body>

<div class="grid"></div>

<div id="poda">

  <div class="glow"></div>
  <div class="border"></div>

  <input class="input" type="text" placeholder="Search something...">

  <!-- Search Icon -->
  <div id="search-icon">
    <svg width="20" height="20" fill="none" stroke="#aaa" stroke-width="2">
      <circle cx="9" cy="9" r="7"></circle>
      <line x1="14" y1="14" x2="19" y2="19"></line>
    </svg>
  </div>

  <!-- Filter Icon -->
  <div id="filter-icon">
    <svg width="18" height="18" fill="none" stroke="#aaa" stroke-width="1.5">
      <path d="M3 5h12M5 10h8M7 15h4"/>
    </svg>
  </div>

</div>

</body>
</html>
