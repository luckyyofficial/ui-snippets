<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Notification Box</title>
    <style>
        /* Modern Centering */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Dark background to make the button pop */
            font-family: sans-serif;
        }

        .button {
            width: 200px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Spaced out items */
            padding: 0px 15px;
            background-color: rgb(66, 66, 66);
            border-radius: 10px;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            overflow: hidden; /* Keeps the animation contained */
        }

        .bell {
            width: 16px;
            flex-shrink: 0;
        }

        .bell path {
            fill: rgb(0, 206, 62);
        }

        .arrow {
            font-size: 20px;
            opacity: 0; /* Hidden by default */
            transform: translateX(-10px);
            transition: all 0.2s;
        }

        .button:hover {
            background-color: rgb(85, 85, 85);
        }

        /* Trigger animation on hover */
        .button:hover .arrow {
            animation: slide-right .4s ease-out forwards;
        }

        /* Arrow animation */
        @keyframes slide-right {
            0% {
                transform: translateX(-15px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .button:active {
            transform: scale(0.97); /* Subtle "pressed" effect */
        }
    </style>
</head>
<body>
    
<button class="button">
    <div style="display: flex; align-items: center; gap: 10px;">
        <svg class="bell" viewBox="0 0 448 512">
            <path d="M224 0c-17.7 0-32 14.3-32 32V49.9C119.5 61.4 64 124.2 64 200v33.4c0 45.4-15.5 89.5-43.8 124.9L5.3 377c-5.8 7.2-6.9 17.1-2.9 25.4S14.8 416 24 416H424c9.2 0 17.6-5.3 21.6-13.6s2.9-18.2-2.9-25.4l-14.9-18.6C399.5 322.9 384 278.8 384 233.4V200c0-75.8-55.5-138.6-128-150.1V32c0-17.7-14.3-32-32-32zm0 96h8c57.4 0 104 46.6 104 104v33.4c0 47.9 13.9 94.6 39.7 134.6H72.3C98.1 328 112 281.3 112 233.4V200c0-57.4 46.6-104 104-104h8zm64 352H224 160c0 17 6.7 33.3 18.7 45.3s28.3 18.7 45.3 18.7s33.3-6.7 45.3-18.7s18.7-28.3 18.7-45.3z"></path>
        </svg>
        <span>Notifications</span>
    </div>
    <div class="arrow">›</div>
</button>

</body>
</html>
