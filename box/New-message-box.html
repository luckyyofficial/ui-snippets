<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Message Box</title>
    <style>
        /* Centering the card on the page */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6; /* Light gray background */
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .card {
            max-width: 320px;
            border: 1px solid rgba(219, 234, 254, 1);
            border-radius: 1rem;
            background-color: white;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background-color: #3b82f6;
            padding: 0.6rem;
            color: white;
        }

        .icon svg {
            height: 1.25rem;
            width: 1.25rem;
        }

        .alert {
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .message {
            margin-top: 1rem;
            font-size: 0.9375rem;
            line-height: 1.5;
            color: #4b5563;
        }

        .actions {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .actions a {
            text-decoration: none;
            display: block;
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .read {
            background-color: #3b82f6;
            color: white;
        }

        .read:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .mark-as-read {
            background-color: #f9fafb;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }

        .mark-as-read:hover {
            background-color: #f3f4f6;
            color: #374151;
        }
    </style>
</head>
<body>
    
<div class="card">
  <div class="header">
    <span class="icon">
      <svg fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" d="M18 3a1 1 0 00-1.447-.894L8.763 6H5a3 3 0 000 6h.28l1.771 5.316A1 1 0 008 18h1a1 1 0 001-1v-4.382l6.553 3.276A1 1 0 0018 15V3z" fill-rule="evenodd"></path>
      </svg>
    </span>
    <p class="alert">New message!</p>
  </div>

  <p class="message">
    You have received a new notification regarding your account activity. Please review the details to ensure everything is correct.
  </p>

  <div class="actions">
    <a class="read" href="#">
      Take a Look
    </a>

    <a class="mark-as-read" href="#">
      Mark as Read
    </a>
  </div>
</div>

</body>
</html>
