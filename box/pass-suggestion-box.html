<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Suggestion Error</title>
    <style>
        /* 1. Centering Logic */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Horizontal centering */
            align-items: center;     /* Vertical centering */
            min-height: 100vh;       /* Full viewport height */
            background-color: #f9fafb; /* Light neutral background */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 2. Container Styles */
        .notifications-container {
            width: 320px;
            height: auto;
            font-size: 0.875rem;
            line-height: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .flex {
            display: flex;
        }

        .flex-shrink-0 {
            flex-shrink: 0;
        }

        /* 3. Alert Design */
        .error-alert {
            border-radius: 0.375rem;
            padding: 1rem;
            background-color: rgb(254 242 242);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .error-svg {
            color: #F87171;
            width: 1.25rem;
            height: 1.25rem;
        }

        .error-prompt-container {
            display: flex;
            flex-direction: column;
            margin-left: 0.75rem; /* Adjusted for better spacing */
        }

        .error-prompt-heading {
            color: #991B1B;
            font-size: 0.875rem;
            line-height: 1.25rem;
            font-weight: bold;
            margin: 0;
        }

        .error-prompt-wrap {
            margin-top: 0.5rem;
            color: #B91C1C;
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        .error-prompt-list {
            padding-left: 1.25rem;
            margin-top: 0.25rem;
            margin-bottom: 0;
            list-style-type: disc;
        }

        /* Dark Mode Support (Optional) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #111827;
            }
        }
    </style>
</head>
<body>
    
<div class="notifications-container">
  <div class="error-alert">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" class="error-svg">
          <path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" fill-rule="evenodd"></path>
        </svg>
      </div>
      <div class="error-prompt-container">
        <p class="error-prompt-heading">Your password isn't strong enough</p>
        <div class="error-prompt-wrap">
          <ul class="error-prompt-list" role="list">
            <li>Password must be at least 18 characters</li>
            <li>Password must include Elon's baby name</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
