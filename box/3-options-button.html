<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Light Theme Glider</title>
    <style>
        /* Center the component */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f5f9; /* Light grey background */
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .radio-container {
            --main-color: #6366f1; /* Modern Indigo */
            --main-color-opacity: rgba(99, 102, 241, 0.15);
            --total-radio: 3;

            display: flex;
            flex-direction: column;
            position: relative;
            background: #ffffff;
            padding: 10px 20px 10px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Hide the actual radio circles */
        .radio-container input {
            cursor: pointer;
            appearance: none;
            position: absolute;
            width: 100%;
            height: 50px;
            left: 0;
            margin: 0;
            z-index: 2;
        }

        /* Position the invisible inputs vertically */
        .radio-container input:nth-of-type(1) { top: 10px; }
        .radio-container input:nth-of-type(2) { top: 60px; }
        .radio-container input:nth-of-type(3) { top: 110px; }

        .radio-container label {
            cursor: pointer;
            padding: 15px 10px;
            height: 20px;
            display: flex;
            align-items: center;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.3s ease;
            z-index: 1;
        }

        /* Highlight text when checked */
        .radio-container input:checked + label {
            color: var(--main-color);
        }

        /* The background line track */
        .glider-container {
            position: absolute;
            left: 20px;
            top: 15px;
            bottom: 15px;
            width: 2px;
            background: #f1f5f9;
        }

        /* The moving indicator (the line) */
        .radio-container .glider-container .glider {
            position: relative;
            height: calc(100% / var(--total-radio));
            width: 100%;
            background: var(--main-color);
            border-radius: 2px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Glow effect for the line */
        .glider::before {
            content: "";
            position: absolute;
            left: 0;
            height: 100%;
            width: 150px;
            background: linear-gradient(90deg, var(--main-color-opacity) 0%, transparent 100%);
        }

        /* GLIDER MOVEMENT LOGIC */
        /* This works only because the glider-container is a SIBLING that comes AFTER the inputs */
        .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
        .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
        .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }

    </style>
</head>
<body>

<div class="radio-container">
    <input type="radio" id="f" name="r" checked />
    <label for="f">Personal</label>

    <input type="radio" id="b" name="r" />
    <label for="b">Professional</label>

    <input type="radio" id="p" name="r" />
    <label for="p">Enterprise</label>

    <div class="glider-container">
        <div class="glider"></div>
    </div>
</div>

</body>
</html>
