<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dark Password Box</title>
<style>
/* Full screen center */
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  background: black; /* Your requested black background */
  font-family: Arial, sans-serif;
}

.group {
  display: flex;
  line-height: 30px;
  align-items: center;
  position: relative;
  width: 250px; /* Slightly wider for better looks */
}

.input {
  width: 100%;
  height: 45px;
  line-height: 30px;
  padding: 0 1rem 0 3rem; /* Adjusted padding for better text alignment */
  border: 2px solid #333; /* Darker border for the black theme */
  border-radius: 10px;
  outline: none;
  background-color: #1a1a1a; /* Dark input background */
  color: #fff; /* White text for contrast */
  transition: .4s ease;
}

.input::placeholder {
  color: #666;
}

/* Interaction states */
.input:focus, .input:hover {
  outline: none;
  border-color: #818cf8; /* Indigo glow */
  background-color: #222;
  box-shadow: 0 0 15px rgba(129, 140, 248, 0.4);
}

.icon {
  position: absolute;
  left: 1rem;
  width: 1.2rem;
  height: 1.2rem;
  stroke: #818cf8; /* Matching the lock color to the focus glow */
  fill: none;
}
</style>
</head>
<body>
     
<div class="group">
  <svg stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon">
    <path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linejoin="round" stroke-linecap="round"></path>
  </svg>
  <input class="input" type="password" placeholder="Password">
</div>

</body>
</html>
