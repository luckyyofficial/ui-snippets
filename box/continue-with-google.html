    <title>Continue with Google Box</title>

<style>
/* Premium Light Theme Centering */
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f8fafc; /* Soft, modern off-white/slate tint */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
    
button {
  max-width: 320px;
  display: flex;
  padding: 0.75rem 1.5rem; /* Slightly more breathable padding */
  font-size: 0.875rem;
  line-height: 1.25rem;
  font-weight: 600; /* Medium-bold for a cleaner aesthetic */
  text-align: center;
  letter-spacing: 0.025em;
  text-transform: uppercase;
  vertical-align: middle;
  align-items: center;
  border-radius: 0.5rem;
  border: 1px solid #e2e8f0; /* Soft border instead of harsh black opacity */
  gap: 0.75rem;
  color: #334155; /* Deep slate gray instead of harsh off-black */
  background-color: #ffffff;
  cursor: pointer;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Soft drop shadow */
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); /* Smoother, faster transition */
}

button svg {
  height: 20px; /* Perfectly balanced visual size */
  width: 20px;
}

/* Elegant hover and active micro-interactions */
button:hover {
  background-color: #fafafa;
  border-color: #cbd5e1;
  color: #1e293b;
  transform: translateY(-1px);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
}

button:active {
  transform: translateY(1px);
  box-shadow: none;
  background-color: #f1f5f9;
}
</style>
