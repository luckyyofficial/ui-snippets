<!DOCTYPE html>
<html lang="en">
<head>
    <title>Message Box - Black Theme</title>
    <style>
        /* ADDED: Centering Logic & Global Dark Theme */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a; /* Deep black background */
            font-family: Arial, Helvetica, sans-serif;
        }

        .messageBox {
            width: fit-content;
            height: 44px; /* Slightly taller for better feel */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212; /* Darker box */
            padding: 0 15px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }

        .messageBox:focus-within {
            border: 1px solid #4a4a4a;
            background-color: #181818;
        }

        .fileUploadWrapper {
            width: fit-content;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #file {
            display: none;
        }

        .fileUploadWrapper label {
            cursor: pointer;
            width: fit-content;
            height: fit-content;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .fileUploadWrapper label svg {
            height: 20px;
        }

        .fileUploadWrapper label svg path,
        .fileUploadWrapper label svg circle {
            stroke: #888; /* Dimmer default color */
            transition: all 0.3s;
        }

        .fileUploadWrapper label:hover svg path {
            stroke: #fff;
        }

        .fileUploadWrapper label:hover svg circle {
            stroke: #fff;
            fill: #222;
        }

        .fileUploadWrapper label:hover .tooltip {
            display: block;
            opacity: 1;
        }

        .tooltip {
            position: absolute;
            top: -45px;
            display: none;
            opacity: 0;
            color: white;
            font-size: 11px;
            text-wrap: nowrap;
            background-color: #222;
            padding: 6px 12px;
            border: 1px solid #333;
            border-radius: 6px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
        }

        #messageInput {
            width: 240px;
            height: 100%;
            background-color: transparent;
            outline: none;
            border: none;
            padding-left: 12px;
            color: #e0e0e0; /* Off-white for less eye strain */
            font-size: 14px;
        }

        /* Changes send button color when user types */
        #messageInput:focus ~ #sendButton svg path,
        #messageInput:valid ~ #sendButton svg path {
            stroke: #00a2ff; /* Blue accent when active */
        }

        #sendButton {
            width: fit-content;
            height: 100%;
            background-color: transparent;
            outline: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        #sendButton svg {
            height: 20px;
            transition: all 0.3s;
        }

        #sendButton svg path {
            stroke: #666;
            transition: all 0.3s;
        }

        #sendButton:hover svg path {
            stroke: #fff;
        }
    </style>
</head>
<body>
    
<div class="messageBox">
  <div class="fileUploadWrapper">
    <label for="file">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 337 337">
        <circle stroke-width="20" r="158.5" cy="168.5" cx="168.5"></circle>
        <path stroke-linecap="round" stroke-width="25" d="M167.759 79V259"></path>
        <path stroke-linecap="round" stroke-width="25" d="M79 167.138H259"></path>
      </svg>
      <span class="tooltip">Add an image</span>
    </label>
    <input type="file" id="file" name="file" />
  </div>

  <input required="" placeholder="Message..." type="text" id="messageInput" />

  <button id="sendButton">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 664 663">
      <path
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="40"
        d="M646.293 331.888L17.7538 17.6187L155.245 331.888M646.293 331.888L17.753 646.157L155.245 331.888M646.293 331.888L318.735 330.228L155.245 331.888"
      ></path>
    </svg>
  </button>
</div>

</body>
</html>
