<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Name Box</title>
    <style>
        /* Centering the container on the page */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa; /* Light theme background */
            font-family: system-ui, -apple-system, sans-serif;
        }

        .input-group {
            position: relative;
        }

        .input {
            border: solid 1.5px #dadce0; /* Subtle light border */
            border-radius: 0.5rem;
            background: none;
            padding: 1rem;
            font-size: 1rem;
            color: #202124; /* Dark text for readability */
            transition: border 150ms cubic-bezier(0.4, 0, 0.2, 1);
            width: 250px; /* Added a default width */
        }

        .user-label {
            position: absolute;
            left: 15px;
            color: #5f6368; /* Muted gray for light theme */
            pointer-events: none;
            transform: translateY(1rem);
            transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Fixed the missing dot for .input:valid */
        .input:focus, .input:valid {
            outline: none;
            border: 1.5px solid #1a73e8; /* Google Blue */
        }

        /* Label float and scale effect */
        .input:focus ~ .user-label, .input:valid ~ .user-label {
            transform: translateY(-50%) scale(0.85);
            background-color: #f8f9fa; /* Matches the body background to "cut" through the border */
            padding: 0 .4em;
            color: #1a73e8;
            left: 10px;
        }
    </style>
</head>
<body>
    
<div class="input-group">
    <input required="" type="text" name="text" autocomplete="off" class="input">
    <label class="user-label">First Name</label>
</div>

</body>
</html>
