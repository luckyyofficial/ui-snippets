<!DOCTYPE html>
<html lang="en">
<head>
    <title>Type Here Box - Light Theme</title>
    <style>
        /* Centering Logic */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa; /* Light gray background */
            font-family: system-ui, -apple-system, sans-serif;
        }

        .textInputWrapper {
            position: relative;
            width: 220px; /* Slightly wider for better presence */
            margin: 12px 5px;
            --accent-color: #72c64d; /* Slightly deeper green for contrast on light */
        }

        .textInputWrapper:before,
        .textInputWrapper:after {
            content: "";
            left: 0;
            right: 0;
            position: absolute;
            pointer-events: none;
            bottom: 0;
            z-index: 4;
            width: 100%;
        }

        /* The base bottom border */
        .textInputWrapper:before {
            transition: border-bottom-color 200ms cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.15); /* Subtle dark line */
        }

        /* The animated accent border */
        .textInputWrapper:after {
            transform: scaleX(0);
            transition: transform 250ms cubic-bezier(0, 0, 0.2, 1);
            will-change: transform;
            border-bottom: 2px solid var(--accent-color);
        }

        .textInputWrapper:focus-within:after {
            transform: scaleX(1);
        }

        .textInputWrapper .textInput {
            border-radius: 8px 8px 0px 0px;
            /* Softer shadow for Light Mode */
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05); 
            background-color: #ffffff;
            transition: background-color 200ms ease;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            padding: 14px 12px;
            width: 100%;
            border: none;
            outline: none;
        }

        .textInput::placeholder {
            transition: opacity 250ms ease;
            opacity: 1;
            color: #999;
        }

        /* Change background slightly on focus */
        .textInputWrapper:focus-within .textInput {
            background-color: #fff;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.08);
        }

        .textInputWrapper:focus-within .textInput::placeholder {
            opacity: 0;
        }

    </style>
</head>
<body>
    
<div class="textInputWrapper">
    <input placeholder="Type Here" type="text" class="textInput">
</div>

</body>
</html>
