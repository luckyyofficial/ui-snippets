<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key to success box - Light Theme</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8; /* Light neutral background */
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            /* Light Theme Palette */
            --white: #ffffff;
            --black: #1e293b;
            --paragraph: #64748b;
            --line: #e2e8f0;
            --primary: #06b6d4; /* Vibrant Cyan */
            --card-bg: #ffffff;

            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
            width: 19rem;
            background-color: var(--card-bg);
            
            /* Softer radial gradients for light mode */
            background-image: 
                radial-gradient(at 88% 40%, rgba(255,255,255,1) 0px, transparent 85%),
                radial-gradient(at 0% 64%, rgba(6, 182, 212, 0.1) 0px, transparent 85%),
                radial-gradient(at 41% 94%, rgba(6, 182, 212, 0.15) 0px, transparent 85%);

            border-radius: 1.25rem;
            /* Subtle inner shadow for depth */
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.05), 
                        inset 0px 1px 1px rgba(255, 255, 255, 1);
        }

        /* The Animated Border Container */
        .card .card__border {
            overflow: hidden;
            pointer-events: none;
            position: absolute;
            z-index: -1;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background-color: #e2e8f0; /* Default border color */
            border-radius: 1.25rem;
        }

        /* The Spinning Light Beam */
        .card .card__border::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                transparent 70%,
                var(--primary) 90%,
                transparent 100%
            );
            animation: rotate 4s linear infinite;
            transform-origin: center;
            translate: -50% -50%;
        }

        /* Inner mask to keep the border thin */
        .card::after {
            content: "";
            position: absolute;
            inset: 2px; /* Border thickness */
            background: var(--card-bg);
            border-radius: 1.15rem;
            z-index: -1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card .card_title__container .card_title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--black);
        }

        .card .card_title__container .card_paragraph {
            margin-top: 0.25rem;
            font-size: 0.75rem;
            color: var(--paragraph);
            line-height: 1.4;
        }

        .card .line {
            width: 100%;
            height: 1px;
            background-color: var(--line);
            border: none;
            margin: 0;
        }

        .card .card__list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card .card__list .card__list_item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card .card__list .card__list_item .check {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1.2rem;
            height: 1.2rem;
            background-color: rgba(6, 182, 212, 0.1); /* Light tinted circle */
            color: var(--primary);
            border-radius: 50%;
        }

        .card .card__list .card__list_item .check_svg {
            width: 0.8rem;
            height: 0.8rem;
            fill: var(--primary);
        }

        .card .card__list .card__list_item .list_text {
            font-size: 0.85rem;
            color: #475569;
            font-weight: 500;
        }

        .card .button {
            cursor: pointer;
            margin-top: 0.5rem;
            padding: 0.8rem;
            width: 100%;
            background: var(--primary);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.1) 100%);
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            border: 0;
            border-radius: 0.75rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .card .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        .card .button:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>
    
<div class="card">
  <div class="card__border"></div>
  <div class="card_title__container">
    <span class="card_title">Keys to Success</span>
    <p class="card_paragraph">The most effective habits to transform your daily life and achieve your goals.</p>
  </div>
  <hr class="line" />
  <ul class="card__list">
    <li class="card__list_item">
      <span class="check">
        <svg class="check_svg" viewBox="0 0 16 16"><path d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z"/></svg>
      </span>
      <span class="list_text">Set Clear Goals</span>
    </li>
    <li class="card__list_item">
      <span class="check">
        <svg class="check_svg" viewBox="0 0 16 16"><path d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z"/></svg>
      </span>
      <span class="list_text">Stay Organized</span>
    </li>
    <li class="card__list_item">
      <span class="check">
        <svg class="check_svg" viewBox="0 0 16 16"><path d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z"/></svg>
      </span>
      <span class="list_text">Continuous Learning</span>
    </li>
  </ul>
  <button class="button">Get Started</button>
</div>

</body>
</html>
