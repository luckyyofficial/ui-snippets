<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Outline Password Box</title>
    <style>
        /* Centering the container */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f5f9; /* Soft light slate background */
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .group {
            display: flex;
            line-height: 30px;
            align-items: center;
            position: relative;
            /* Increased max-width for better usability */
            width: 100%;
            max-width: 280px;
        }

        .input {
            width: 100%;
            height: 48px;
            line-height: 30px;
            padding: 0 1rem;
            padding-left: 3rem; /* Space for the lock icon */
            border: 2px solid #e2e8f0; /* Visible light border by default */
            border-radius: 12px;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
            transition: all .3s ease;
            font-size: 1rem;
        }

        .input::placeholder {
            color: #94a3b8;
        }

        /* Hover and Focus States */
        .input:hover {
            border-color: #cbd5e1;
        }

        .input:focus {
            outline: none;
            border-color: #818cf8;
            background-color: #fff;
            /* Glow effect */
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.2);
        }

        .icon {
            position: absolute;
            left: 1.2rem;
            fill: none;
            width: 1.1rem;
            height: 1.1rem;
            color: #64748b; /* Muted icon color */
            transition: all .3s ease;
            z-index: 1;
        }

        /* Change icon color when input is focused */
        .input:focus + .icon, 
        .group:focus-within .icon {
            color: #818cf8;
        }
    </style>
</head>
<body>
    
<div class="group">
    <svg stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon">
        <path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linejoin="round" stroke-linecap="round"></path>
    </svg>
    <input class="input" type="password" placeholder="Password">
</div>

</body>
</html>
