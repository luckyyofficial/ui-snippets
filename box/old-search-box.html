<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Dark Search</title>
    <style>
        /* 1. Centering the container on a black background */
        body {
            background-color: #000000; /* Pure black theme */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 2. The Search Box Logic */
        .input {
            background-color: #1a1a1a; /* Darker grey box */
            
            /* Borders: Changed 'none' to 'solid' to make them visible */
            border: 2px solid #444; 
            border-top-width: 1.7em; /* The unique thick top style */
            
            margin: 0;
            padding: 5px;
            color: #ffffff; /* White text so you can see typing */
            word-wrap: break-word;
            
            /* Outline: Helps define the shape against the black background */
            outline: 3px solid #333;
            
            height: 35px;
            font-size: 17px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 200px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 3. Hover & Focus States */
        .input:hover, .input:focus {
            /* Flattens the top border */
            border-top-width: 0.2em;
            border-color: #f1e8e8;
            
            /* Flips to light theme colors for interaction */
            background-color: #f1e8e8;
            color: #000000;
            
            /* Glow effect */
            outline: 8px solid #222;
        }

        /* Styling the placeholder text specifically */
        .input::placeholder {
            color: #666;
        }
    </style>
</head>
<body>

    <input type="text" name="text" class="input" placeholder="Search...">

</body>
</html>
