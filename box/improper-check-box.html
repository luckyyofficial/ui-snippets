<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Improper Lines Checkbox - Light Theme</title>
    <style>
        /* Centering the component */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcfcfc; /* Very light gray/white */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .checkbox-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            overflow: visible; /* Allow the 'messy' lines to breathe */
        }

        .checkbox-wrapper input[type="checkbox"] {
            visibility: hidden;
            display: none;
        }

        .checkbox-wrapper *,
        .checkbox-wrapper ::after,
        .checkbox-wrapper ::before {
            box-sizing: border-box;
            user-select: none;
        }

        .checkbox-wrapper .label {
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #444; /* Soft dark text */
            font-size: 16px;
            font-weight: 500;
        }

        .checkbox-wrapper .label svg {
            margin-right: 10px;
            transition: transform 0.2s ease;
        }

        .checkbox-wrapper .label:active svg {
            transform: scale(0.9); /* Subtle click feedback */
        }

        /* The Box outline */
        .checkbox-wrapper rect {
            stroke: #adadad; /* Light gray border */
            stroke-width: 2px;
            transition: stroke 0.3s ease;
        }

        /* The Messy Path */
        .checkbox-wrapper .path1 {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; /* Hidden by default */
        }

        /* Checked State Logic */
        .checkbox-wrapper .check:checked + label rect {
            stroke: #333; /* Darken box when checked */
        }

        .checkbox-wrapper .check:checked + label .path1 {
            stroke-dashoffset: 0;
            opacity: 1;
        }

        /* Specific light theme messy line color */
        .checkbox-wrapper .path1 {
            stroke: #2e7d32; /* A natural "correct" green */
            stroke-width: 4;
        }

    </style>
</head>
<body>
    
<div class="checkbox-wrapper">
  <input type="checkbox" class="check" id="check-light" />
  <label for="check-light" class="label">
    <svg width="60" height="60" viewBox="0 0 95 95">
      <rect
        x="30"
        y="30"
        width="40"
        height="40"
        fill="none"
        rx="4" 
      ></rect>
      <g transform="translate(0,-952.36222)">
        <path
          d="m 56,963 c -102,122 6,9 7,9 17,-5 -66,69 -38,52 122,-77 -7,14 18,4 29,-11 45,-43 23,-4"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="path1"
        ></path>
      </g>
    </svg>
    <span>Confirm Selection</span>
  </label>
</div>

</body>
</html>
