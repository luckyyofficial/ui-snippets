<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Accordion Hover</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .container {
            display: flex;
            width: 600px;
            height: 350px;
            gap: 12px;
            padding: 10px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }

        .panel {
            position: relative;
            flex-grow: 1; /* Use flex-grow for smoother interpolation */
            overflow: hidden;
            border-radius: 16px;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            
            /* The Secret Sauce: Custom Cubic Bezier */
            transition: flex-grow 0.7s cubic-bezier(0.25, 1, 0.3, 1), 
                        filter 0.5s ease;
            
            /* Performance Hint */
            will-change: flex-grow;
            filter: grayscale(0.3);
        }

        /* Expanded State */
        .panel:hover {
            flex-grow: 10; 
            filter: grayscale(0);
        }

        /* Glassmorphism text overlay */
        .panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 40%);
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .panel span {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) rotate(-90deg);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.3, 1);
            opacity: 0.8;
        }

        .panel:hover span {
            transform: translateX(-50%) rotate(0);
            opacity: 1;
            font-size: 1.4rem;
            bottom: 40px;
        }

        /* Subtle border glow on hover */
        .panel:hover {
            outline: 4px solid rgba(124, 58, 237, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=400');">
        <span>Explore</span>
    </div>
    <div class="panel" style="background-image: url('https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=400');">
        <span>Nature</span>
    </div>
    <div class="panel" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=400');">
        <span>Escape</span>
    </div>
</div>

</body>
</html>
