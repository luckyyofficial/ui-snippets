<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Switch Options : Light Blue Theme</title>
    <style>
        /* Centering the container */   
        body {
            margin: 0;   
            display: flex;   
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8; /* Light blue-grey background */
            font-family: sans-serif;
        }

        .radio-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .radio-input * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        .radio-input label {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0px 20px;
            width: 220px;
            cursor: pointer;
            height: 50px;
            position: relative;
        }

        .radio-input label::before {
            position: absolute;
            content: "";
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 45px;
            z-index: 1; /* Changed to 1 to sit behind text but stay visible */
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-radius: 10px;
            border: 2px solid transparent;
        }

        /* Hover effect - Light Grey */
        .radio-input label:hover::before {
            background-color: #f8f9fa;
        }

        /* Selected State - Light Blue background */
        .radio-input .label:has(input:checked)::before {
            background-color: #eef2ff;
            border-color: #435dd8;
            height: 50px;
        }

        /* Text color for light theme */
        .radio-input .label .text {
            color: #334155;
            font-weight: 500;
            z-index: 2;
        }

        /* Radio Circle styling */
        .radio-input .label input[type="radio"] {
            background-color: #cbd5e1;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-input .label input[type="radio"]:checked {
            background-color: #435dd8;
            animation: pulse 0.7s forwards;
        }

        .radio-input .label input[type="radio"]:before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
            background-color: #fff;
            transform: scale(0);
        }

        .radio-input .label input[type="radio"]:checked::before {
            transform: scale(1);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(67, 93, 216, 0.4);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(67, 93, 216, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(67, 93, 216, 0);
            }
        }
    </style>
</head>
<body>
    
<div class="radio-input">
  <label class="label">
    <input type="radio" id="value-1" checked name="value-radio" value="value-1" />
    <p class="text">Designer</p>
  </label>
  <label class="label">
    <input type="radio" id="value-2" name="value-radio" value="value-2" />
    <p class="text">Student</p>
  </label>
  <label class="label">
    <input type="radio" id="value-3" name="value-radio" value="value-3" />
    <p class="text">Teacher</p>
  </label>
</div>

</body>
</html>
