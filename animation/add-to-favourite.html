<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Favourite Animation</title>
    <style>
        /* Centering the container */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa; /* Light grey theme background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        label {
            background-color: white;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            user-select: none;
            border-radius: 12px;
            /* Softer shadow for a premium light theme look */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            color: #333;
            transition: transform 0.2s ease;
        }

        /* Subtle hover effect */
        label:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        input {
            display: none;
        }

        /* SVG Heart Styling */
        label svg {
            transition: all 0.3s ease;
            color: #666;
        }

        input:checked + label svg {
            fill: #ff4757;
            stroke: #ff4757;
            animation: heartButton 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes heartButton {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Text Animation Logic */
        input + label .action {
            position: relative;
            overflow: hidden;
            display: grid;
            font-weight: 500;
        }

        input + label .action span {
            grid-column: 1;
            grid-row: 1;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input + label .action span.option-1 {
            transform: translateY(0%);
            opacity: 1;
        }

        input:checked + label .action span.option-1 {
            transform: translateY(-120%);
            opacity: 0;
        }

        input + label .action span.option-2 {
            transform: translateY(120%);
            opacity: 0;
            color: #ff4757; /* Matches the heart when active */
        }

        input:checked + label .action span.option-2 {
            transform: translateY(0%);
            opacity: 1;
        }
    </style>
</head>
<body>
     
<input type="checkbox" id="favorite" name="favorite-checkbox" value="favorite-button">
<label for="favorite" class="container">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-heart">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
  </svg>
  <div class="action">
    <span class="option-1">Add to Favorites</span>
    <span class="option-2">Added to Favorites</span>
  </div>
</label>

</body>
</html>
