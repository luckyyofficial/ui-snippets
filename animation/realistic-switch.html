<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Rocker Switch</title>
    <style>
        /* Modern Studio Environment Setup */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #25262e 0%, #111115 100%);
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        /* The Outer Bezel/Housing Socket */
        .toggle-container {
            position: relative;
            padding: 6px;
            width: 160px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #18191d 0%, #2c2e36 100%);
            box-shadow: 
                inset 0 2px 5px rgba(0,0,0,0.8),
                0 1px 1px rgba(255,255,255,0.1),
                0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 400px; /* Crucial for 3D depth */
        }

        /* Hidden functional input layer mapping the interaction boundary */
        .toggle-container input[type=checkbox] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 10;
            cursor: pointer;
        }

        /* The Internal Switch Button Frame (Rocker Panel) */
        .rocker-switch {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-sizing: border-box;
            
            /* Initial State: Left side (ON) is up, Right side (OFF) is pressed down */
            background: linear-gradient(to right, #fdfcfb 0%, #cbd1d6 40%, #a1a8b0 70%, #888e96 100%);
            border: 1px solid #747981;
            box-shadow: 
                -4px 0 10px rgba(0,0,0,0.3),
                inset 2px 2px 2px rgba(255,255,255,0.9),
                inset -4px 0 4px rgba(0,0,0,0.2);
            
            transform: rotateY(-12deg) translateZ(5px);
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
        }

        /* Text Label Typographical Layout */
        .label {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .on-label {
            color: #15b000;
            text-shadow: 0 0 10px rgba(21, 176, 0, 0.8), 0 1px 0 rgba(255,255,255,0.5);
        }

        .off-label {
            color: #22252a;
            text-shadow: 0 1px 0 rgba(255,255,255,0.2);
        }

        /* Indicating Light (The central physical groove indicator) */
        .rocker-switch::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 20%;
            bottom: 20%;
            width: 4px;
            background: linear-gradient(to bottom, #747981, #cbd1d6);
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: inset 1px 0 1px rgba(0,0,0,0.4);
            opacity: 0.4;
        }

        /* --- THE MECHANICAL FLIP STATE (:checked) --- */
        
        /* Rock the button panel physically to the opposite angle */
        input[type=checkbox]:checked ~ .rocker-switch {
            background: linear-gradient(to right, #888e96 0%, #a1a8b0 30%, #cbd1d6 60%, #fdfcfb 100%);
            box-shadow: 
                4px 0 10px rgba(0,0,0,0.3),
                inset -2px 2px 2px rgba(255,255,255,0.9),
                inset 4px 0 4px rgba(0,0,0,0.2);
            transform: rotateY(12deg) translateZ(5px);
        }

        /* Dim the ON side text graphics */
        input[type=checkbox]:checked ~ .rocker-switch .on-label {
            color: #22252a;
            text-shadow: 0 1px 0 rgba(255,255,255,0.2);
        }

        /* Ignite the OFF side text graphics */
        input[type=checkbox]:checked ~ .rocker-switch .off-label {
            color: #ff2a2a;
            text-shadow: 0 0 12px rgba(255, 42, 42, 0.9), 0 1px 0 rgba(255,255,255,0.4);
        }

        /* Subtle mechanical clicking shake on active mouse press down */
        .toggle-container:active .rocker-switch {
            transform: scale(0.97) rotateY(0deg);
        }
    </style>
</head>
<body>

    <div class="toggle-container">
        <input type="checkbox" id="switch-action">
        
        <div class="rocker-switch">
            <span class="label on-label">On</span>
            <span class="label off-label">Off</span>
        </div>
    </div>

</body>
</html>
