<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Navbar Animation</title>
</head>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f7f6;
        font-family: sans-serif;
    }

    .event-wrapper {
        background-color: #ffffff;
        padding: 10px 18px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        height: 2.5rem;
        position: relative;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .event-wrapper-inp {
        display: none;
    }

    /* Bar Container */
    .bar {
        display: flex;
        height: 16px;
        width: 22px;
        flex-direction: column;
        justify-content: space-between; /* Evenly spaces the 3 lines */
        transition: all 0.4s;
    }

    .bar-list {
        display: block;
        width: 100%;
        height: 3px;
        border-radius: 50px;
        background-color: #555;
        transition: all 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6); /* Bouncy effect */
        position: relative;
    }

    /* ANIMATION LOGIC: When Checked */
    
    /* Top Line: Move down and rotate */
    .event-wrapper-inp:checked ~ .bar > .top {
        transform: translateY(6.5px) rotate(45deg);
        background-color: #ff4757;
    }

    /* Middle Line: Fade out and slide left */
    .event-wrapper-inp:checked ~ .bar > .middle {
        opacity: 0;
        transform: translateX(-10px);
    }

    /* Bottom Line: Move up and rotate */
    .event-wrapper-inp:checked ~ .bar > .bottom {
        transform: translateY(-6.5px) rotate(-45deg);
        background-color: #ff4757;
    }

    /* Menu Container Styling */
    .menu-container {
        background-color: white;
        border-radius: 12px;
        position: absolute;
        width: 160px;
        left: 50%;
        transform: translateX(-50%);
        top: 130%;
        overflow: hidden;
        /* Start hidden */
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition: all 0.3s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .event-wrapper-inp:checked ~ .menu-container {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0px);
    }

    .menu-list {
        padding: 12px 15px;
        font-size: 14px;
        color: #333;
        transition: background 0.2s;
    }

    .menu-list:hover {
        background-color: #f0f0f0;
    }
</style>
<body>

<label class="event-wrapper">
    <input type="checkbox" class="event-wrapper-inp" />
    <div class="bar">
        <span class="top bar-list"></span>
        <span class="middle bar-list"></span>
        <span class="bottom bar-list"></span>
    </div>
    
    <section class="menu-container">
        <div class="menu-list">Edit Profile</div>
        <div class="menu-list">Share Link</div>
        <div style="color: #ff4757;" class="menu-list">Delete</div>
    </section>
</label>

</body>
</html>
