<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Black Options Animation - Lightning Dark Mode</title>
    <style>
        body {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background-color: #121212;
        }   

        .radio-input {
          display: flex;
          align-items: center;
          gap: 2px;
          background-color: #000000;
          padding: 4px;
          border-radius: 12px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .radio-input input {
          display: none;
        }

        .radio-input .label {
          width: 90px;
          height: 60px;
          background: linear-gradient(to bottom, #222222, #181818);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 8px;
          transition: all 0.2s ease;
          border-top: 1px solid #333333;
          position: relative;
          cursor: pointer;
          box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.4);
        }

        .label:has(input[type="radio"]:checked) {
          box-shadow: 0px 4px 10px rgba(0, 0, 0, 0);
          background: linear-gradient(to bottom, #111111, #111111);
          border-top: 1px solid transparent;
        }

        .label:first-child {
          border-top-left-radius: 8px;
          border-bottom-left-radius: 8px;
        }

        .label:last-child {
          border-top-right-radius: 8px;
          border-bottom-right-radius: 8px;
        }

        .label::before {
          content: "";
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 100%;
          height: 100%;
          border-radius: 8px;
          background: linear-gradient(
            to bottom,
            transparent 10%,
            transparent,
            transparent 90%
          );
          transition: all 0.2s ease;
          z-index: 1;
        }

        .label:has(input[type="radio"]:checked)::before {
          background: linear-gradient(
            to bottom,
            transparent 10%,
            rgba(202, 226, 253, 0.08),
            transparent 90%
          );
        }

        .label .text {
          color: #777777;
          font-size: 14px;
          line-height: 12px;
          padding: 0px;
          font-weight: 700;
          letter-spacing: 0.5px;
          text-transform: uppercase;
          transition: all 0.2s ease;
          z-index: 2;
          text-shadow: 0px 2px 3px rgba(0, 0, 0, 0.8);
        }

        .label input[type="radio"]:checked + .text {
          color: rgb(202, 226, 253);
          text-shadow: 0px 0px 12px rgba(202, 226, 253, 0.8);
        }
    </style>
</head>
<body>

<div class="radio-input">
  <label class="label" for="value-1">
    <input value="value-1" name="value-radio" id="value-1" type="radio" checked /> 
    <span class="text">Play</span>
  </label>
  <label class="label" for="value-2">
    <input value="value-2" name="value-radio" id="value-2" type="radio" /> 
    <span class="text">Stop</span>
  </label> 
  <label class="label" for="value-3">
    <input value="value-3" name="value-radio" id="value-3" type="radio" />
    <span class="text">Reset</span>
  </label> 
</div>

</body>
</html>
