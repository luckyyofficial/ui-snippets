<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shake Button Animation</title>
    <style>
        /* This centers the button on the screen */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5; /* Light grey background */
        }

        button {
            height: 3em;
            width: 8em;
            border: none;
            border-radius: 10em;
            background: #016DD9;
            font-size: 17px;
            color: #ffffff;
            font-family: sans-serif;
            font-weight: 500;
            cursor: pointer; /* Makes it feel like a real button */
            transition: background 0.2s;
        }

        button:hover {
            background: #015bb5; /* Slight color change on hover */
            animation: shake3856 0.3s linear infinite both;
        }

        @keyframes shake3856 {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>
    
<button>Shake</button>

</body>
</html>
