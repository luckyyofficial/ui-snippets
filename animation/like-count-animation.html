<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Like count in real time animation - Light Theme</title>
    <style>
        /* Centering the button in the viewport */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Light background */
        }

        #heart {
            display: none;
        }

        .like-button {
            position: relative;
            cursor: pointer;
            display: flex;
            height: 48px;
            width: 136px;
            border-radius: 16px;
            border: none;
            background-color: #f0f0f0; /* Match background */
            overflow: hidden;
            /* Light theme Neomorphic shadows */
            box-shadow:
                inset -2px -2px 5px rgba(255, 255, 255, 1),
                inset 2px 2px 5px rgba(0, 0, 0, 0.05),
                8px 8px 16px rgba(0, 0, 0, 0.1),
                -8px -8px 16px rgba(255, 255, 255, 1);
        }

        .like {
            width: 70%;
            height: 100%;
            display: flex;
            cursor: pointer;
            align-items: center;
            justify-content: space-evenly;
            z-index: 2;
        }

        .like-icon {
            fill: #b0b0b0; /* Light gray icon */
            height: 28px;
            width: 28px;
            transition: all 0.2s ease-out;
        }

        .like-text {
            color: #444; /* Darker text for readability */
            font-size: 16px;
            font-weight: 600;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .like-count {
            position: absolute;
            right: 0;
            width: 30%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 16px;
            font-weight: bold;
            border-left: 1px solid #ddd; /* Subtle light border */
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Initial position for the incremented number */
        .like-count.two {
            transform: translateY(40px);
        }

        /* Active State - Checkbox checked */
        .on:checked ~ .like .like-icon {
            fill: #fc4e4e;
            animation: enlarge 0.3s ease-out 1;
        }

        .on:checked ~ .like-count.two {
            transform: translateY(0);
            color: #fc4e4e; /* Make count red when liked */
        }

        .on:checked ~ .like-count.one {
            transform: translateY(-40px);
        }

        @keyframes enlarge {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="like-button">
  <input class="on" id="heart" type="checkbox" />
  <label class="like" for="heart">
    <svg
      class="like-icon"
      fill-rule="nonzero"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z"
      ></path>
    </svg>
    <span class="like-text">Likes</span>
  </label>
  <span class="like-count one">68</span>
  <span class="like-count two">69</span>
</div>

</body>
</html>
