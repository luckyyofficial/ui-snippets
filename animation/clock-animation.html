<!DOCTYPE html>
<html lang="en">
<head>
    <title>Real-Time Clock</title>
    <style>
        /* Centering Logic */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
        }

        .face {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            outline: 10px solid #333;
            background: repeating-radial-gradient(circle at 50% 50%, 
                rgba(200,200,200,.2) 0%, rgba(200,200,200,.2) 2%, 
                transparent 2%, transparent 3%, rgba(200,200,200,.2) 3%, 
                transparent 3%), 
                conic-gradient(white 0%, silver 10%, white 35%, silver 45%, 
                white 60%, silver 70%, white 80%, silver 95%, white 100%);
            box-shadow: inset 0 0 20px #0007, 0 15px 35px rgba(0,0,0,0.1);
        }

        .hour, .minute, .second-hand {
            position: absolute;
            transform-origin: bottom center;
            transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44); /* Adds a slight "bounce" */
        }

        .hour {
            width: 6px;
            height: 50px;
            background: #333;
            left: calc(50% - 3px);
            top: 40px;
            border-radius: 4px;
            z-index: 1;
        }

        .minute {
            width: 4px;
            height: 70px;
            background: #666;
            left: calc(50% - 2px);
            top: 20px;
            border-radius: 4px;
            z-index: 2;
        }

        .second-hand {
            width: 2px;
            height: 85px;
            background: red;
            left: calc(50% - 1px);
            top: 10px;
            z-index: 3;
        }

        /* Center Pin */
        .face::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: #333;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 10;
            border: 2px solid white;
        }

        .v-index, .h-index {
            position: absolute;
            color: #333;
            font-size: 24px;
            font-family: serif;
            z-index: 0;
            pointer-events: none;
        }

        .v-index { width: 100%; text-align: center; top: 0px; text-shadow: 0 155px 0 #333; }
        .h-index { top: 72px; left: 8px; transform: rotate(-90deg); text-shadow: 0 157px 0 #333; }
    </style>
</head>
<body>

<div class="face">
    <div class="v-index">XII</div>
    <div class="h-index">IX</div>
    
    <div class="hour" id="hour"></div>
    <div class="minute" id="minute"></div>
    <div class="second-hand" id="second"></div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        // Calculate degrees
        // 360 degrees / 60 units = 6 degrees per unit
        const secondsDeg = (seconds / 60) * 360;
        const minutesDeg = ((minutes / 60) * 360) + ((seconds / 60) * 6);
        const hoursDeg = ((hours / 12) * 360) + ((minutes / 60) * 30);

        document.getElementById('second').style.transform = `rotate(${secondsDeg}deg)`;
        document.getElementById('minute').style.transform = `rotate(${minutesDeg}deg)`;
        document.getElementById('hour').style.transform = `rotate(${hoursDeg}deg)`;
    }

    // Update every second
    setInterval(updateClock, 1000);

    // Run once immediately so it doesn't wait 1 second to start
    updateClock();
</script>

</body>
</html>
