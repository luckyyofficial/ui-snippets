<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Box Animation</title>
</head>
<style>
    
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  max-width: 260px;
  width: 100%;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.title {
  font-size: 16px;
  font-weight: 700;
  color: #1a1a1a;
}

.full-stats-btn {
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 5px;
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 600;
  color: #1a1a1a;
  cursor: pointer;
  transition: all 0.2s;
}

.full-stats-btn:hover {
  background: #f5f5f5;
  border-color: #d0d0d0;
}

.range {
  margin-bottom: 4px;
}

.range-value {
  font-size: 30px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -0.5px;
}

.range-unit {
  font-size: 28px;
  font-weight: 300;
  color: #b0b0b0;
  margin-left: 4px;
}

.date-range {
  font-size: 11px;
  color: #999;
  margin-bottom: 20px;
}

.chart-container {
  position: relative;
  height: 90px;
  margin-bottom: 20px;
}

.chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  height: 100%;
  position: relative;
  padding: 0 14px;
}

.avg-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 45%;
  height: 1.5px;
  background: #e0e0e0;
  z-index: 1;
}

.avg-label {
  position: absolute;
  top: -35%;
  right: 0;
  background: #1a1a1a;
  color: white;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  z-index: 2;
}

.bar-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex: 1;
  z-index: 2;
}

.bar-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.bar {
  width: 20px;
  background: linear-gradient(to bottom, #ff5a76 0%, #ff8fa3 100%);
  border-radius: 10px;
  position: relative;
  transition: all 0.3s ease;
}

.bar:hover {
  transform: scale(1.05);
}

.dot {
  width: 8px;
  height: 8px;
  background: white;
  border: 1.5px solid #ff5a76;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.dot-top {
  top: -4px;
}

.dot-bottom {
  bottom: -4px;
}

.day-label {
  font-size: 9px;
  color: #999;
  font-weight: 500;
}

/* Bar heights - Monday */
.bar-mo {
  height: 32px;
  margin-bottom: 8px;
}
.bar-tu {
  height: 44px;
  margin-bottom: 14px;
}
.bar-we {
  height: 25px;
  margin-bottom: 12px;
}
.bar-th {
  height: 32px;
  margin-bottom: 10px;
}
.bar-fr {
  height: 44px;
  margin-bottom: 14px;
}
.bar-sa {
  height: 38px;
  margin-bottom: 12px;
}
.bar-su {
  height: 28px;
  margin-bottom: 13px;
}

.readings {
  border-top: 1.5px solid #f0f0f0;
  padding-top: 12px;
}

.reading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1.5px solid #f0f0f0;
}

.reading:last-child {
  border-bottom: none;
}

.reading-time {
  font-size: 9px;
  color: #999;
}

.reading-value {
  font-size: 12px;
  font-weight: 700;
  color: #1a1a1a;
}

</style>
<body>
    
<div class="card">
  <div class="header">
    <span class="title">Heart Rate</span>
    <button class="full-stats-btn">Full stats-&gt;</button>
  </div>

  <div class="range">
    <span class="range-value">40-189</span>
    <span class="range-unit">bpm</span>
  </div>

  <div class="date-range">10 - 17 Sep 2022</div>

  <div class="chart-container">
    <div class="avg-line"></div>
    <div class="avg-label">Avg. 57</div>
    <div class="chart">
      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-mo"></div>
        </div>
        <div class="day-label">Mo</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-tu">
            <div class="dot dot-top"></div>
          </div>
        </div>
        <div class="day-label">Tu</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-we">
            <div class="dot dot-bottom"></div>
          </div>
        </div>
        <div class="day-label">We</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-th"></div>
        </div>
        <div class="day-label">Th</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-fr">
            <div class="dot dot-bottom"></div>
          </div>
        </div>
        <div class="day-label">Fr</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-sa"></div>
        </div>
        <div class="day-label">Sa</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-su">
            <div class="dot dot-top"></div>
            <div class="dot dot-bottom"></div>
          </div>
        </div>
        <div class="day-label">Su</div>
      </div>
    </div>
  </div>

  <div class="readings">
    <div class="reading">
      <span class="reading-time">Today (14:00)</span>
      <span class="reading-value">125</span>
    </div>
    <div class="reading">
      <span class="reading-time">Today (13:00)</span>
      <span class="reading-value">110</span>
    </div>
  </div>
</div>

</body>
</html>
