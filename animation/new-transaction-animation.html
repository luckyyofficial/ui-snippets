<!DOCTYPE html>
<html lang="en">
<head>
    <title>New Transaction Animation</title>
    <style>
        /* ADDED: Centering & Base Styles */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f7f6; /* Light, clean background */
            font-family: "Lexend Deca", sans-serif;
        }

        .container {
            background-color: #ffffff;
            display: flex;
            width: 100%; /* Fluid width */
            max-width: 460px; /* Limits size on desktop */
            height: 120px;
            position: relative;
            border-radius: 12px;
            transition: 0.3s ease-in-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden; /* Ensures elements don't pop out prematurely */
        }

        /* Hover logic: Container shrinks to focus on the animation */
        .container:hover {
            transform: scale(1.03);
            max-width: 220px;
        }

        .left-side {
            background-color: #5de2a3;
            width: 130px;
            height: 100%;
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            overflow: hidden;
        }

        .container:hover .left-side {
            width: 100%;
        }

        .right-side {
            flex: 1; /* Takes up remaining space */
            display: flex;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            justify-content: space-between;
            white-space: nowrap;
            transition: 0.3s;
            background-color: #fff;
        }

        .new {
            font-size: 20px;
            font-weight: 500;
            margin-left: 20px;
            color: #333;
        }

        .arrow {
            width: 18px;
            height: 18px;
            margin-right: 20px;
        }

        /* Card & POS Animation Elements */
        .card {
            width: 70px;
            height: 46px;
            background-color: #c7ffbc;
            border-radius: 6px;
            position: absolute;
            display: flex;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            box-shadow: 4px 4px 10px rgba(77, 200, 143, 0.4);
        }

        .card-line {
            width: 55px;
            height: 10px;
            background-color: #80ea69;
            border-radius: 2px;
            margin-top: 7px;
        }

        .buttons {
            width: 6px;
            height: 6px;
            background-color: #379e1f;
            box-shadow: 0 -10px 0 0 #26850e, 0 10px 0 0 #56be3e;
            border-radius: 50%;
            margin-top: 12px;
            transform: rotate(90deg);
        }

        .post {
            width: 63px;
            height: 75px;
            background-color: #dddde0;
            position: absolute;
            z-index: 11;
            top: 125px; /* Hidden below */
            border-radius: 6px;
        }

        .post-line {
            width: 47px;
            height: 9px;
            background-color: #545354;
            position: absolute;
            border-radius: 0 0 3px 3px;
            right: 8px;
            top: 8px;
        }

        .screen {
            width: 47px;
            height: 23px;
            background-color: #ffffff;
            position: absolute;
            top: 22px;
            right: 8px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dollar {
            font-size: 16px;
            font-weight: bold;
            color: #4b953b;
            opacity: 0;
        }

        .numbers, .numbers-line2 {
            width: 10px;
            height: 10px;
            background-color: #838183;
            box-shadow: 0 -15px 0 0 #838183, 0 15px 0 0 #838183;
            border-radius: 2px;
            position: absolute;
            transform: rotate(90deg);
            left: 26px;
        }

        .numbers { top: 52px; }
        .numbers-line2 { top: 68px; background-color: #aaa9ab; box-shadow: 0 -15px 0 0 #aaa9ab, 0 15px 0 0 #aaa9ab; }

        /* Animations */
        .container:hover .card {
            animation: slide-top 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) both;
        }

        .container:hover .post {
            animation: slide-post 1s cubic-bezier(0.165, 0.84, 0.44, 1) both;
        }

        .container:hover .dollar {
            animation: fade-in-fwd 0.3s 1s forwards;
        }

        @keyframes slide-top {
            0% { transform: translateY(0); }
            50% { transform: translateY(-70px) rotate(90deg); }
            100% { transform: translateY(-10px) rotate(90deg); }
        }

        @keyframes slide-post {
            100% { transform: translateY(-75px); }
        }

        @keyframes fade-in-fwd {
            0% { opacity: 0; transform: translateY(5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Improved Responsiveness */
        @media (max-width: 500px) {
            .container {
                width: 90%;
                height: 100px;
            }
            .new { font-size: 16px; }
            .container:hover { max-width: 180px; }
            .left-side { width: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-side">
        <div class="card">
            <div class="card-line"></div>
            <div class="buttons"></div>
        </div>
        <div class="post">
            <div class="post-line"></div>
            <div class="screen">
                <div class="dollar">$</div>
            </div>
            <div class="numbers"></div>
            <div class="numbers-line2"></div>
        </div>
    </div>
    <div class="right-side">
        <div class="new">New Transaction</div>
        <svg viewBox="0 0 451.846 451.847" class="arrow">
            <path fill="#cfcfcf" d="M345.441 248.292L151.154 442.573c-12.359 12.365-32.397 12.365-44.75 0-12.354-12.354-12.354-32.391 0-44.744L278.318 225.92 106.409 54.017c-12.354-12.359-12.354-32.394 0-44.748 12.354-12.359 32.391-12.359 44.75 0l194.287 194.284c6.177 6.18 9.262 14.271 9.262 22.366 0 8.099-3.091 16.196-9.267 22.373z"></path>
        </svg>
    </div>
</div>

</body>
</html>
