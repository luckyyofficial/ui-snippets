<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weeks selection Animation</title>
    <style>
        /* 1. Center the container on the page */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9; /* Optional: light background */
            font-family: sans-serif;
        }

        .days-btn-container {
            display: flex;
            width: 300px;
            align-items: center;
            justify-content: space-evenly;
            height: 34px;
        }

        .day-btn {
            display: none; /* Hide the original checkbox */
        }

        .day-label {
            background-color: transparent;
            font-size: 11px;
            font-weight: 600;
            color: #ff5b22;
            cursor: pointer;
            border: 2px solid #ff5b22;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            /* Added transition for a smooth "animation" effect */
            transition: all 0.3s ease;
            box-sizing: border-box; 
        }

        /* Apply styles for the selected state */
        .day-btn:checked + .day-label {
            background-color: #ffe53b;
            background-image: linear-gradient(147deg, #ffe53b 0%, #ff2525 74%);
            border: none;
            color: white;
            /* Slight pop effect */
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    
<div class="days-btn-container">
  <input class="day-btn" id="monday" type="checkbox" checked />
  <label class="day-label" for="monday">M</label>

  <input class="day-btn" id="tuesday" type="checkbox" checked />
  <label class="day-label" for="tuesday">T</label>

  <input class="day-btn" id="wednesday" type="checkbox" checked />
  <label class="day-label" for="wednesday">W</label>

  <input class="day-btn" id="thursday" type="checkbox" checked />
  <label class="day-label" for="thursday">T</label>

  <input class="day-btn" id="friday" type="checkbox" checked />
  <label class="day-label" for="friday">F</label>

  <input class="day-btn" id="saturday" type="checkbox" />
  <label class="day-label" for="saturday">S</label>

  <input class="day-btn" id="sunday" type="checkbox" />
  <label class="day-label" for="sunday">S</label>
</div>

</body>
</html>
