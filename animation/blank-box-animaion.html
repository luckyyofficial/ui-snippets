<!DOCTYPE html>
<html lang="en">
<head>
    <title>Blank Box-Animation</title>
    <style>
        /* 1. Center the container on the page */
        body {
            margin: 0;
            display: flex;
            justify-content: center; /* Horizontal center */
            align-items: center;     /* Vertical center */
            min-height: 100vh;       /* Full screen height */
            background-color: #1a1a1a; /* Dark background to make the loader pop */
        }

        .loader {
            --color: #a5a5b0;
            --size: 70px;
            width: var(--size);
            height: var(--size);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .loader span {
            width: 100%;
            height: 100%;
            background-color: var(--color);
            animation: keyframes-blink 0.6s alternate infinite linear;
        }

        /* Animation Delays */
        .loader span:nth-child(1) { animation-delay: 0ms; }
        .loader span:nth-child(2) { animation-delay: 200ms; }
        .loader span:nth-child(3) { animation-delay: 300ms; }
        .loader span:nth-child(4) { animation-delay: 400ms; }
        .loader span:nth-child(5) { animation-delay: 500ms; }
        .loader span:nth-child(6) { animation-delay: 600ms; }

        @keyframes keyframes-blink {
            0% {
                opacity: 0.3;
                transform: scale(0.5) rotate(5deg);
            }
            100% { /* Changed 50% to 100% for a smoother alternate loop */
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
     
<div class="loader">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

</body>
</html>
