<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Discount Buy Card</title>
    <style>
        /* Modern Reset & Center alignment */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        /* Upgraded Card Design */
        .card {
            width: 220px;
            height: 310px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Subtle glow effect on hover */
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(173, 255, 47, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(173, 255, 47, 0.1);
        }
        
        /* Premium Background Monogram */
        .card-image {
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5em;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.4s ease;
            user-select: none;
        }
        
        .card:hover .card-image {
            transform: scale(1.08);
        }
        
        /* Organized Typography Layout */
        .content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .title {
            margin: 0;
            font-size: 0.75em;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            color: #aeaebe;
            line-height: 1.3;
        }
        
        /* Price Container */
        .price-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .price {
            font-size: 1.4em;
            font-weight: 800;
            color: #ffffff;
        }
        
        .old-price {
            font-size: 0.9em;
            text-decoration: line-through;
            color: #62627a;
            font-weight: 500;
        }
        
        /* High-End Interactive Button */
        .card-btn {
            width: 100%;
            height: 44px;
            background-color: #ffffff;
            border: none;
            border-radius: 14px;
            color: #000000;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .card-btn:hover {
            background-color: greenyellow;
            box-shadow: 0 0 20px rgba(173, 255, 47, 0.6);
            transform: scale(1.02);
        }

        .card-btn:active {
            transform: scale(0.98);
        }
        
        /* Floating Discount Tag */
        .tag {
            position: absolute;
            background-color: greenyellow;
            color: #000000;
            right: 16px;
            top: 16px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 800;
            margin: 0;
            box-shadow: 0 4px 12px rgba(173, 255, 47, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <p class="tag">-50%</p>
    
    <div class="card-image">III</div>
    
    <div class="content">
        <p class="title">Uiverse Premium Font<br>(Regular)</p>
        <div class="price-container">
            <span class="price">$3</span>
            <span class="old-price">$6</span>
        </div>
    </div>
    
    <button class="card-btn">DOWNLOAD</button>
</div>

</body>
</html>
