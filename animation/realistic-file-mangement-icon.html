<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Light Folder</title>
    <style>
        /* 1. Light Theme Layout */
        body {
            background-color: #f0f2f5; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            --transition: 400ms;
            --folder-W: 120px;
            --folder-H: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            height: 140px;
            position: relative;
            border: 1px solid #e0e0e0;
        }

        /* 2. Folder Animation Logic */
        .folder {
            position: absolute;
            top: -15px;
            width: var(--folder-W);
            height: var(--folder-H);
            animation: float 3s infinite ease-in-out;
            transition: transform var(--transition) ease;
        }

        .folder .front-side,
        .folder .back-side {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform var(--transition) ease;
            transform-origin: bottom center;
            border-radius: 10px;
        }

        /* The "Internal Paper" Sheets */
        .folder .back-side::before {
            content: "";
            display: block;
            background-color: #ffffff;
            border: 1px solid #ddd;
            width: 90%;
            height: 100%;
            position: absolute;
            left: 5%;
            top: 0;
            border-radius: 5px;
            transition: transform var(--transition);
            z-index: -1;
        }

        /* Hover Interactions */
        .container:hover .front-side {
            transform: rotateX(-45deg) skewX(5deg);
        }

        .container:hover .back-side::before {
            transform: translateY(-25px) rotateZ(2deg);
        }

        /* 3. Visual Styling (Colors) */
        .folder .tip {
            background: #ffc107; /* Solid mustard yellow for light theme */
            width: 50px;
            height: 12px;
            border-radius: 6px 6px 0 0;
            position: absolute;
            top: -10px;
            left: 0;
            z-index: 2;
        }

        .folder .cover {
            background: #ffdb58; /* Warm yellow */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
            border: 1px solid #e6b800;
        }

        .folder .front-side {
            z-index: 5;
        }

        .folder .back-side {
            background: #e6b800; /* Darker yellow for the inside back */
            z-index: 1;
        }

        /* 4. Choose File Button */
        .custom-file-upload {
            font-size: 0.9em;
            color: #444;
            text-align: center;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            width: 100%;
            padding: 10px 25px;
            font-weight: 600;
        }

        .custom-file-upload:hover {
            background: #fff;
            border-color: #ffc107;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .custom-file-upload input[type="file"] {
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="folder">
        <div class="back-side"></div>
        
        <div class="front-side">
            <div class="tip"></div>
            <div class="cover" style="height: 100%; width: 100%; border-radius: 10px;"></div>
        </div>
    </div>
    
    <label class="custom-file-upload">
        <input type="file" />
        Choose a file
    </label>
</div>

</body>
</html>
