<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Design Animation</title>
    <style>
        /* --- Page Layout --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center;     /* Center vertically */
            min-height: 100vh;       /* Full screen height */
            background-color: #0a0a0a; /* Dark background to make the yellow pop */
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* --- Animation Variables --- */
        .btn-wrapper {
            --dot-size: 6px;
            --line-weight: 1px;
            --line-distance: 0.9rem 1.1rem;
            --animation-speed: 0.35s;
            --dot-color: #666;
            --line-color: #999;

            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            height: auto;
            padding: var(--line-distance);
            background-color: #0000;
            transition: background-color 0.3s ease-in-out;
            user-select: none;
        }

        /* Background Glow on Hover */
        .btn-wrapper:has(.btn:hover) {
            animation: backround-color-change calc(var(--animation-speed) * 4) ease-in-out forwards;
        }

        @keyframes backround-color-change {
            80% { background-color: #0000; }
            100% { background-color: #e5ff0022; }
        }

        /* --- Button Core Styles --- */
        .btn {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8rem 1.25rem;
            background-color: #e5ff00;
            background-image: linear-gradient(#0000, #0004);
            border: none;
            color: #000;
            font-size: 1rem;
            font-weight: 600;
            text-transform: capitalize;
            border-radius: 30% / 200%;
            cursor: pointer;
            box-shadow:
                0 0 0px 1px #0003,
                0px 5px 4px rgba(0, 0, 0, 0.1),
                0px 20px 15px rgba(0, 0, 0, 0.2);
            transition:
                background-color 0.2s ease-in-out,
                transform 0.2s ease-in-out,
                box-shadow 0.2s ease-in-out,
                border-radius 0.3s ease-in-out;
        }

        .btn:hover {
            background-color: #fff;
            transform: scale(1.05);
            border-radius: 10% / 200%;
        }

        .btn:active {
            background-color: #e5ff00;
            transform: scale(0.98);
            border-radius: 20% / 200%;
        }

        .btn-svg {
            margin-left: 0.5rem;
            height: 24px;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke: #0007;
            fill: none;
            transition: all 0.3s ease-in-out;
        }

        .btn:hover .btn-svg {
            stroke: #000;
            fill: #e5ff00;
        }

        /* --- Blueprint Dots --- */
        .dot {
            position: absolute;
            width: var(--dot-size);
            aspect-ratio: 1;
            border-radius: 50%;
            background-color: var(--dot-color);
            opacity: 0;
            z-index: 2;
        }

        /* Dot Animations */
        .btn-wrapper:has(.btn:hover) .dot.top.left { animation: move-top-left var(--animation-speed) ease-in-out forwards; top: 50%; left: 20%; }
        .btn-wrapper:has(.btn:hover) .dot.top.right { animation: move-top-right var(--animation-speed) ease-in-out forwards; animation-delay: calc(var(--animation-speed) * 0.6); top: 50%; right: 20%; }
        .btn-wrapper:has(.btn:hover) .dot.bottom.right { animation: move-bottom-right var(--animation-speed) ease-in-out forwards; animation-delay: calc(var(--animation-speed) * 1.2); bottom: 50%; right: 20%; }
        .btn-wrapper:has(.btn:hover) .dot.bottom.left { animation: move-bottom-left var(--animation-speed) ease-in-out forwards; animation-delay: calc(var(--animation-speed) * 1.8); bottom: 50%; left: 20%; }

        @keyframes move-top-left { 100% { top: calc(var(--dot-size) * -0.5); left: calc(var(--dot-size) * -0.5); opacity: 1; }}
        @keyframes move-top-right { 100% { top: calc(var(--dot-size) * -0.5); right: calc(var(--dot-size) * -0.5); opacity: 1; }}
        @keyframes move-bottom-right { 100% { bottom: calc(var(--dot-size) * -0.5); right: calc(var(--dot-size) * -0.5); opacity: 1; }}
        @keyframes move-bottom-left { 100% { bottom: calc(var(--dot-size) * -0.5); left: calc(var(--dot-size) * -0.5); opacity: 1; }}

        /* --- Blueprint Lines --- */
        .line {
            position: absolute;
            background-color: var(--line-color);
        }

        .line.horizontal { height: var(--line-weight); width: 100%; background-image: repeating-linear-gradient(90deg, transparent 0 2px, var(--line-color) 2px 4px); }
        .line.vertical { width: var(--line-weight); height: 100%; background-image: repeating-linear-gradient(0deg, transparent 0 2px, var(--line-color) 2px 4px); }

        .line.top { top: 0; transform-origin: left; transform: scaleX(0); }
        .line.right { right: 0; transform-origin: top; transform: scaleY(0); }
        .line.bottom { bottom: 0; transform-origin: right; transform: scaleX(0); }
        .line.left { left: 0; transform-origin: bottom; transform: scaleY(0); }

        .btn-wrapper:has(.btn:hover) .line.top { animation: draw var(--animation-speed) ease-in-out forwards; animation-delay: 0.3s; }
        .btn-wrapper:has(.btn:hover) .line.right { animation: draw var(--animation-speed) ease-in-out forwards; animation-delay: 0.6s; }
        .btn-wrapper:has(.btn:hover) .line.bottom { animation: draw var(--animation-speed) ease-in-out forwards; animation-delay: 0.9s; }
        .btn-wrapper:has(.btn:hover) .line.left { animation: draw var(--animation-speed) ease-in-out forwards; animation-delay: 1.2s; }

        @keyframes draw { 100% { transform: scale(1); } }

    </style>
</head>
<body>

<div class="btn-wrapper">
    <div class="line horizontal top"></div>
    <div class="line vertical right"></div>
    <div class="line horizontal bottom"></div>
    <div class="line vertical left"></div>

    <div class="dot top left"></div>
    <div class="dot top right"></div>
    <div class="dot bottom right"></div>
    <div class="dot bottom left"></div>

    <button class="btn">
        <span class="btn-text">start designing</span>
        <svg class="btn-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.6744 11.4075L15.7691 17.1233C15.7072 17.309 15.5586 17.4529 15.3709 17.5087L3.69348 20.9803C3.22819 21.1186 2.79978 20.676 2.95328 20.2155L6.74467 8.84131C6.79981 8.67588 6.92419 8.54263 7.08543 8.47624L12.472 6.25822C12.696 6.166 12.9535 6.21749 13.1248 6.38876L17.5294 10.7935C17.6901 10.9542 17.7463 11.1919 17.6744 11.4075Z"></path>
            <path d="M3.2959 20.6016L9.65986 14.2376"></path>
            <path d="M17.7917 11.0557L20.6202 8.22724C21.4012 7.44619 21.4012 6.17986 20.6202 5.39881L18.4989 3.27749C17.7178 2.49645 16.4515 2.49645 15.6704 3.27749L12.842 6.10592"></path>
            <path d="M11.7814 12.1163C11.1956 11.5305 10.2458 11.5305 9.66004 12.1163C9.07426 12.7021 9.07426 13.6519 9.66004 14.2376C10.2458 14.8234 11.1956 14.8234 11.7814 14.2376C12.3671 13.6519 12.3671 12.7021 11.7814 12.1163Z"></path>
        </svg>
    </button>
</div>

</body>
</html>
