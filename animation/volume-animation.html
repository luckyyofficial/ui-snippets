<!DOCTYPE html>
<html lang="en">
<head>
<title>Advanced Volume Slider</title>

<style>
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  background: #050505;
  font-family: 'Segoe UI', Arial, sans-serif;
}

.container {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #111;
  padding: 15px 25px;
  border-radius: 50px; /* Pill shape looks more modern */
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.2s;
}

.container:hover {
  transform: scale(1.02);
  box-shadow: 0 0 25px rgba(255,255,255,0.05);
}

/* Slider Container */
.slider-wrapper {
  display: flex;
  align-items: center;
  width: 200px;
}

/* Range Input Styling */
.level {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 5px;
  /* This creates the 'filled' look dynamically via JS */
  background: linear-gradient(to right, #fff 50%, #444 50%);
  outline: none;
  cursor: pointer;
  transition: height 0.2s;
}

.level:hover {
  height: 8px;
}

/* The Thumb (The knob you grab) */
.level::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.level::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

/* Icon and Text */
.volume-icon {
  width: 24px;
  height: 24px;
  fill: #fff;
  opacity: 0.7;
}

.value {
  color: white;
  font-size: 14px;
  font-weight: bold;
  min-width: 45px;
}
</style>
</head>
<body>

<div class="container">
  <div id="icon-container">
    <svg class="volume-icon" viewBox="0 0 24 24" id="speaker-icon">
      <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
    </svg>
  </div>

  <div class="slider-wrapper">
    <input type="range" min="0" max="100" value="50" class="level" id="range">
  </div>

  <div class="value" id="value">50%</div>
</div>

<script>
const range = document.getElementById("range");
const valueText = document.getElementById("value");
const icon = document.getElementById("speaker-icon");

function updateSlider() {
  const val = range.value;
  
  // 1. Update the Text
  valueText.textContent = val + "%";
  
  // 2. Update the Progress Background color
  // Syntax: linear-gradient(to right, color-filled %, color-empty %)
  range.style.background = `linear-gradient(to right, #fff ${val}%, #444 ${val}%)`;
  
  // 3. (Optional) Change Icon based on volume
  if (val == 0) {
    icon.style.opacity = "0.3";
  } else if (val < 50) {
    icon.style.opacity = "0.6";
  } else {
    icon.style.opacity = "1";
  }
}

range.addEventListener("input", updateSlider);

// Run once on load to set initial gradient
updateSlider();
</script>

</body>
</html>
