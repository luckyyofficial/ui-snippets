<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Offer Button Animation</title>
    <style>
        /* Centering Layout */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            overflow: hidden; /* Prevents scrollbars during animation */
        }

        .btn-container {
            --btn-color: #d8ff7c;
            --corner-color: #0002;
            --corner-dist: 24px;
            --corner-multiplier: 1.5;
            --timing-function: cubic-bezier(0, 0, 0, 2.5);
            --duration: 250ms;

            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            position: relative;
            min-width: 160px;
            min-height: calc(var(--corner-dist) * 2);
            border-radius: 16px;
            border: none;
            padding: 0.25em 1em;
            background: linear-gradient(#fff2, #0001), var(--btn-color);
            box-shadow:
                1px 1px 2px -1px #fff inset,
                0 2px 1px #00000010,
                0 4px 2px #00000010,
                0 8px 4px #00000010,
                0 16px 8px #00000010,
                0 32px 16px #00000010;
            transition: transform var(--duration) var(--timing-function), filter var(--duration) var(--timing-function);
            cursor: pointer;
            z-index: 2; /* Keeps button above the drawers */
        }

        .btn-drawer {
            position: absolute;
            display: flex;
            justify-content: center;
            min-height: 32px;
            border-radius: 16px;
            border: none;
            padding: 0.25em 1em;
            font-size: 0.8em;
            font-weight: 600;
            font-family: sans-serif;
            color: #0009;
            background: linear-gradient(#fff2, #0001), var(--btn-color);
            background-color: #fbff13;
            opacity: 0;
            transition: transform calc(0.5 * var(--duration)) ease, opacity calc(0.5 * var(--duration)) ease;
            filter: blur(2px);
            z-index: 1;
        }

        .transition-top { top: 0; border-radius: 12px 12px 0 0; align-items: start; }
        .transition-bottom { bottom: 0; border-radius: 0 0 12px 12px; align-items: end; }

        .btn-text {
            display: inline-block;
            font-size: 1.25em;
            font-family: sans-serif;
            font-weight: 600;
            color: #0000;
            background-image: linear-gradient(#444, #000a);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 1px 0 #fff6) drop-shadow(0 -1px 0 #0006);
            transition: transform var(--duration) var(--timing-function), color var(--duration) var(--timing-function);
        }

        .btn-corner {
            position: absolute;
            width: 32px;
            fill: none;
            stroke: var(--corner-color);
            transition: transform var(--duration) var(--timing-function);
        }

        /* Initial Corner Positions */
        .btn-corner:nth-of-type(1) { top: 0; left: 0; transform: translate(calc(-1 * var(--corner-dist)), calc(-1 * var(--corner-dist))) rotate(90deg); }
        .btn-corner:nth-of-type(2) { top: 0; right: 0; transform: translate(var(--corner-dist), calc(-1 * var(--corner-dist))) rotate(180deg); }
        .btn-corner:nth-of-type(3) { bottom: 0; right: 0; transform: translate(var(--corner-dist), var(--corner-dist)) rotate(-90deg); }
        .btn-corner:nth-of-type(4) { bottom: 0; left: 0; transform: translate(calc(-1 * var(--corner-dist)), var(--corner-dist)) rotate(0deg); }

        /* Hover Interactions */
        .btn-container:hover .btn { transform: scale(1.05); }
        
        .btn-container:hover .transition-top {
            transform: translateY(-24px) rotateZ(4deg);
            filter: blur(0px);
            opacity: 1;
            animation: hue-anim 3s infinite linear;
        }

        .btn-container:hover .transition-bottom {
            transform: translateY(24px) rotateZ(-4deg);
            filter: blur(0px);
            opacity: 1;
            animation: hue-anim 3s infinite linear;
        }

        .btn-container:hover .btn-text {
            color: #0008;
            transform: scale(1.05);
        }

        .btn-container:hover .btn-corner {
            --corner-color: #0004;
        }

        .btn-container:hover .btn-corner:nth-of-type(1) { transform: translate(-36px, -36px) rotate(90deg); }
        .btn-container:hover .btn-corner:nth-of-type(2) { transform: translate(36px, -36px) rotate(180deg); }
        .btn-container:hover .btn-corner:nth-of-type(3) { transform: translate(36px, 36px) rotate(-90deg); }
        .btn-corner:nth-of-type(4) { transform: translate(-24px, 24px) rotate(0deg); }
        .btn-container:hover .btn-corner:nth-of-type(4) { transform: translate(-36px, 36px) rotate(0deg); }

        @keyframes hue-anim {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(-70deg); }
        }
    </style>
</head>
<body>

<div class="btn-container">
    <div class="btn-drawer transition-top">expires in...</div>
    <div class="btn-drawer transition-bottom">...8 hours</div>

    <button class="btn">
        <span class="btn-text">Get Offer</span>
    </button>

    <svg class="btn-corner" xmlns="http://www.w3.org/2000/svg" viewBox="-1 1 32 32"><path d="M32,32C14.355,32,0,17.645,0,0h.985c0,17.102,13.913,31.015,31.015,31.015v.985Z"></path></svg>
    <svg class="btn-corner" xmlns="http://www.w3.org/2000/svg" viewBox="-1 1 32 32"><path d="M32,32C14.355,32,0,17.645,0,0h.985c0,17.102,13.913,31.015,31.015,31.015v.985Z"></path></svg>
    <svg class="btn-corner" xmlns="http://www.w3.org/2000/svg" viewBox="-1 1 32 32"><path d="M32,32C14.355,32,0,17.645,0,0h.985c0,17.102,13.913,31.015,31.015,31.015v.985Z"></path></svg>
    <svg class="btn-corner" xmlns="http://www.w3.org/2000/svg" viewBox="-1 1 32 32"><path d="M32,32C14.355,32,0,17.645,0,0h.985c0,17.102,13.913,31.015,31.015,31.015v.985Z"></path></svg>
</div>

</body>
</html>
