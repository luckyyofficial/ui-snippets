<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Smooth Options - Dark Mode</title>
</head>
<style>

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #121212;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
}

.radio-container {
  --main-color: #f7e479;
  --main-color-opacity: rgba(247, 228, 121, 0.12);

  /* change this according inputs count */
  --total-radio: 3;

  display: flex;
  flex-direction: column;
  position: relative;
  padding-left: 0.75rem;
}

.radio-container input {
  cursor: pointer;
  appearance: none;
  position: absolute;
}

.radio-container .glider-container {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: linear-gradient(
    0deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(40, 40, 40, 1) 50%,
    rgba(255, 255, 255, 0) 100%
  );
  width: 2px;
}

.radio-container .glider-container .glider {
  position: relative;
  height: calc(100% / var(--total-radio));
  width: 100%;
  background: linear-gradient(
    0deg,
    rgba(0, 0, 0, 0) 0%,
    var(--main-color) 50%,
    rgba(0, 0, 0, 0) 100%
  );
  transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56);
}

.radio-container .glider-container .glider::before {
  content: "";
  position: absolute;
  height: 60%;
  width: 300px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--main-color);
  filter: blur(12px);
  opacity: 0.6;
}

.radio-container .glider-container .glider::after {
  content: "";
  position: absolute;
  left: 0;
  height: 100%;
  width: 150px;
  background: linear-gradient(
    90deg,
    var(--main-color-opacity) 0%,
    rgba(0, 0, 0, 0) 100%
  );
}

.radio-container label {
  cursor: pointer;
  padding: 1rem 1.5rem;
  position: relative;
  color: #777777;
  font-weight: 500;
  font-size: 1rem;
  transition: color 0.3s ease-in-out;
}

.radio-container label:hover {
  color: #aaaaaa;
}

.radio-container input:checked + label {
  color: var(--main-color);
  text-shadow: 0 0 10px rgba(247, 228, 121, 0.4);
}

.radio-container input:nth-of-type(1):checked ~ .glider-container .glider {
  transform: translateY(0);
}

.radio-container input:nth-of-type(2):checked ~ .glider-container .glider {
  transform: translateY(100%);
}

.radio-container input:nth-of-type(3):checked ~ .glider-container .glider {
  transform: translateY(200%);
}

.radio-container input:nth-of-type(4):checked ~ .glider-container .glider {
  transform: translateY(300%);
}

.radio-container input:nth-of-type(5):checked ~ .glider-container .glider {
  transform: translateY(400%);
}

.radio-container input:nth-of-type(6):checked ~ .glider-container .glider {
  transform: translateY(500%);
}

.radio-container input:nth-of-type(7):checked ~ .glider-container .glider {
  transform: translateY(600%);
}

.radio-container input:nth-of-type(8):checked ~ .glider-container .glider {
  transform: translateY(700%);
}

.radio-container input:nth-of-type(9):checked ~ .glider-container .glider {
  transform: translateY(800%);
}

.radio-container input:nth-of-type(10):checked ~ .glider-container .glider {
  transform: translateY(900%);
}

</style>
<body>
    
<div class="radio-container">
  <input checked="" id="radio-free" name="radio" type="radio" />
  <label for="radio-free">Free</label>
  <input id="radio-basic" name="radio" type="radio" />
  <label for="radio-basic">Basic</label>
  <input id="radio-premium" name="radio" type="radio" />
  <label for="radio-premium">Premium</label>

  <div class="glider-container">
    <div class="glider"></div>
  </div>
</div>

</body>
</html>
