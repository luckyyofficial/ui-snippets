<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Link Button Animation</title>
    <style>
        /* Modern Reset & Centering */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Clean light background */
        }

        .centralize {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        button {
            position: relative; /* Essential for absolute positioning of spans */
            background-color: #f2f7fa;
            width: 130px;
            height: 40px;
            border: 1px solid #d0e0f0;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s ease;
            outline: none;
        }

        /* Initial State: "Copy link" */
        button span:first-child {
            color: #0e418f;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.4s ease;
        }

        /* Success State: "Copied" */
        button span:last-child {
            position: absolute;
            top: 50%;
            left: 50%;
            color: #ffffff;
            opacity: 0;
            transform: translate(-50%, 100%); /* Start below the button view */
            transition: all 0.4s ease;
        }

        /* Interaction States */
        button:hover {
            background-color: #e8f0fe;
        }

        button:focus {
            background-color: #0e418f;
            width: 140px;
            border-color: #0e418f;
        }

        button:focus span:first-child {
            opacity: 0;
            transform: translate(-50%, -150%); /* Slide up and out */
        }

        button:focus span:last-child {
            opacity: 1;
            transform: translate(-50%, -50%); /* Slide into center */
        }

        .description {
            margin-top: 15px;
            color: #708090;
            font-size: 0.9rem;
        }

        svg {
            margin-right: 4px;
        }
    </style>
</head>
<body>
     
<div class="centralize">
  <div>
    <button>
      <span>
        <svg
          width="14"
          height="14"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 467 512.22"
        >
          <path d="M131.07 372.11c.37 1 .57 2.08.57 3.2 0 1.13-.2 2.21-.57 3.21v75.91c0 10.74 4.41 20.53 11.5 27.62s16.87 11.49 27.62 11.49h239.02c10.75 0 20.53-4.4 27.62-11.49s11.49-16.88 11.49-27.62V152.42c0-10.55-4.21-20.15-11.02-27.18l-.47-.43c-7.09-7.09-16.87-11.5-27.62-11.5H170.19c-10.75 0-20.53 4.41-27.62 11.5s-11.5 16.87-11.5 27.61v219.69zm-18.67 12.54H57.23c-15.82 0-30.1-6.58-40.45-17.11C6.41 356.97 0 342.4 0 326.52V57.79c0-15.86 6.5-30.3 16.97-40.78l.04-.04C27.51 6.49 41.94 0 57.79 0h243.63c15.87 0 30.3 6.51 40.77 16.98l.03.03c10.48 10.48 16.99 24.93 16.99 40.78v36.85h50c15.9 0 30.36 6.5 40.82 16.96l.54.58c10.15 10.44 16.43 24.66 16.43 40.24v302.01c0 15.9-6.5 30.36-16.96 40.82-10.47 10.47-24.93 16.97-40.83 16.97H170.19c-15.9 0-30.35-6.5-40.82-16.97-10.47-10.46-16.97-24.92-16.97-40.82v-69.78zM340.54 94.64V57.79c0-10.74-4.41-20.53-11.5-27.63-7.09-7.08-16.86-11.48-27.62-11.48H57.79c-10.78 0-20.56 4.38-27.62 11.45l-.04.04c-7.06 7.06-11.45 16.84-11.45 27.62v268.73c0 10.86 4.34 20.79 11.38 27.97 6.95 7.07 16.54 11.49 27.17 11.49h55.17V152.42c0-15.9 6.5-30.35 16.97-40.82 10.47-10.47 24.92-16.96 40.82-16.96h170.35z"></path>
        </svg>
        Copy link
      </span>
      <span>Copied!</span>
    </button>
    <div class="description">
      <p>Click the button to see the animation</p>
    </div>
  </div>
</div>

</body>
</html>
