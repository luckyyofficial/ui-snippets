<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Animation - Light Theme</title>
</head>
<style>
    /* 1. Centering on the screen */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f8f9fa; /* Light gray background */
        font-family: 'Segoe UI', sans-serif;
    }

    .main > .inp {
        display: none;
    }

    .main {
        font-weight: 700;
        color: #444; /* Darker text for light theme */
        background-color: #ffffff;
        padding: 5px 20px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        height: 2.8rem;
        width: 12rem;
        position: relative;
        cursor: pointer;
        justify-content: space-between;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Soft shadow */
        transition: all 0.3s ease;
    }

    .main:hover {
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
    }

    /* Hamburger Bars - Adjusted for Light Theme */
    .bar {
        display: flex;
        height: 16px;
        width: 22px;
        flex-direction: column;
        justify-content: space-between;
    }

    .bar-list {
        display: block;
        width: 100%;
        height: 3px;
        border-radius: 50px;
        background-color: #555; /* Gray bars */
        transition: all 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6);
    }

    /* Hamburger to X Animation Logic */
    .inp:checked ~ .bar > .top {
        transform: translateY(6.5px) rotate(45deg);
        background-color: #ff4757; /* Accent color when open */
    }

    .inp:checked ~ .bar > .middle {
        opacity: 0;
        transform: translateX(-10px);
    }

    .inp:checked ~ .bar > .bottom {
        transform: translateY(-6.5px) rotate(-45deg);
        background-color: #ff4757;
    }

    /* Menu Container */
    .menu-container {
        background-color: white;
        color: #333;
        border-radius: 12px;
        position: absolute;
        width: 100%;
        left: 0;
        top: 120%;
        overflow: hidden;
        /* Animation properties */
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        z-index: 10;
    }

    .inp:checked ~ .menu-container {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* Menu Items Animation */
    .menu-list {
        padding: 12px 15px;
        transition: all 0.3s ease;
        font-weight: 500;
        border-bottom: 1px solid #f1f1f1;
        opacity: 0;
        transform: translateY(15px);
    }

    .menu-list:last-child {
        border-bottom: none;
    }

    .menu-list:hover {
        background-color: #fff1f2;
        color: #ff4757;
        padding-left: 20px;
    }

    /* Staggered entrance when menu is checked */
    .inp:checked ~ .menu-container .menu-list {
        opacity: 1;
        transform: translateY(0);
    }

    .inp:checked ~ .menu-container .menu-list:nth-child(1) { transition-delay: 0.1s; }
    .inp:checked ~ .menu-container .menu-list:nth-child(2) { transition-delay: 0.2s; }
    .inp:checked ~ .menu-container .menu-list:nth-child(3) { transition-delay: 0.3s; }
    .inp:checked ~ .menu-container .menu-list:nth-child(4) { transition-delay: 0.4s; }

</style>
<body>
    
<label class="main">
  Menu
  <input class="inp" type="checkbox" />
  <div class="bar">
    <span class="top bar-list"></span>
    <span class="middle bar-list"></span>
    <span class="bottom bar-list"></span>
  </div>
  <section class="menu-container">
    <div class="menu-list">Food</div>
    <div class="menu-list">Entertainment</div>
    <div class="menu-list">Blog</div>
    <div class="menu-list">Location</div>
  </section>
</label>

</body>
</html>
