<!DOCTYPE html>
<html lang="en">
<head>
    <title>Circuit Loading Animation</title>
    <style>
        /* Ensures the container takes up the full screen and centers content */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #080808; /* Deep black for contrast */
            overflow: hidden;
        }

        .main-container {
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .trace-bg {
            stroke: #222; /* Slightly visible paths */
            stroke-width: 2;
            fill: none;
        }

        .trace-flow {
            stroke-width: 2.5;
            fill: none;
            stroke-dasharray: 50 400;
            stroke-dashoffset: 450;
            /* Stronger glow effect for visibility */
            filter: drop-shadow(0 0 8px currentColor);
            animation: flow 2.5s linear infinite;
        }

        /* Vibrant Colors */
        .yellow { stroke: #ffea00; color: #ffea00; }
        .blue { stroke: #00ccff; color: #00ccff; }
        .green { stroke: #00ff15; color: #00ff15; }
        .purple { stroke: #9d00ff; color: #9d00ff; }
        .red { stroke: #ff3300; color: #ff3300; }

        @keyframes flow {
            to { stroke-dashoffset: 0; }
        }

        .chip-text {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Subtle pulse for the chip */
        .chip {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(0,0,0,0.8)); }
            50% { filter: drop-shadow(0 0 15px rgba(0,204,255,0.2)); }
        }
    </style>
</head>
<body>
    
<div class="main-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#333"></stop>
          <stop offset="100%" stop-color="#111"></stop>
        </linearGradient>
      </defs>

      <g>
        <path d="M100 100 H200 V210 H326" class="trace-bg"></path>
        <path d="M100 100 H200 V210 H326" class="trace-flow purple"></path>

        <path d="M80 180 H180 V230 H326" class="trace-bg"></path>
        <path d="M80 180 H180 V230 H326" class="trace-flow blue"></path>

        <path d="M60 260 H150 V250 H326" class="trace-bg"></path>
        <path d="M60 260 H150 V250 H326" class="trace-flow yellow"></path>

        <path d="M100 350 H200 V270 H326" class="trace-bg"></path>
        <path d="M100 350 H200 V270 H326" class="trace-flow green"></path>

        <path d="M700 90 H560 V210 H474" class="trace-bg"></path>
        <path d="M700 90 H560 V210 H474" class="trace-flow blue"></path>

        <path d="M740 160 H580 V230 H474" class="trace-bg"></path>
        <path d="M740 160 H580 V230 H474" class="trace-flow green"></path>

        <path d="M720 250 H590 V250 H474" class="trace-bg"></path>
        <path d="M720 250 H590 V250 H474" class="trace-flow red"></path>

        <path d="M680 340 H570 V270 H474" class="trace-bg"></path>
        <path d="M680 340 H570 V270 H474" class="trace-flow yellow"></path>
      </g>

      <g class="chip">
        <rect x="330" y="190" width="140" height="100" rx="10" fill="url(#chipGrad)" stroke="#444" stroke-width="2"></rect>
        <text x="400" y="245" fill="#fff" font-size="18" text-anchor="middle" class="chip-text">Loading</text>
      </g>

      <g fill="#444">
        <circle cx="100" cy="100" r="4"></circle>
        <circle cx="80" cy="180" r="4"></circle>
        <circle cx="60" cy="260" r="4"></circle>
        <circle cx="100" cy="350" r="4"></circle>
        <circle cx="700" cy="90" r="4"></circle>
        <circle cx="740" cy="160" r="4"></circle>
        <circle cx="720" cy="250" r="4"></circle>
        <circle cx="680" cy="340" r="4"></circle>
      </g>
    </svg>
</div>

</body>
</html>
