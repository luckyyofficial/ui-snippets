<!DOCTYPE html>
<html lang="en">
<head>
    <title>Scan Text Loading Animation</title>
    <style>
        /* 1. Center everything and set a dark background */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Necessary to see the light text */
            overflow: hidden;
        }

        .loader {
            max-width: fit-content;
            color: rgb(242, 255, 240);
            font-size: 50px;
            /* Changed font-family to sans-serif since 'Mine' is a local/custom font */
            font-family: sans-serif; 
            position: relative;
            font-style: italic;
            font-weight: 600;
            margin: 0; /* Remove default p margins */
        }

        .loader span {
            display: inline-block; /* Helps with animation stability */
            animation: cut 2s infinite;
            transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .loader:hover {
            color: #fcffdf;
        }

        /* The Glow effect */
        .loader::after {
            position: absolute;
            content: "";
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background-color: #ff828291;
            top: 0px;
            filter: blur(10px);
            animation: scan 2s infinite;
            left: 0;
            z-index: 0;
            transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* The Scan Line */
        .loader::before {
            position: absolute;
            content: "";
            width: 100%;
            height: 5px;
            border-radius: 4px;
            background-color: #ff8282;
            top: 0px;
            animation: scan 2s infinite;
            left: 0;
            z-index: 1;
            filter: opacity(0.9);
            transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scan {
            0%, 100% { top: 0px; }
            50% { top: 100%; } /* Using percentage is safer than 54px */
        }

        @keyframes cut {
            0%, 100% { clip-path: inset(0 0 0 0); }
            25% { clip-path: inset(100% 0 0 0); }
            75% { clip-path: inset(0 0 100% 0); }
        }
    </style>
</head>
<body>
    
<p class="loader"><span>Scan</span></p>

</body>
</html>
