<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Search Box Animation</title>
    <style>
        body {
            background-color: #0f0f0f; /* Dark background to see the glow */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container_chat_bot {
            display: flex;
            flex-direction: column;
            max-width: 320px;
            width: 100%;
        }

        .container_chat_bot .container-chat-options {
            position: relative;
            display: flex;
            background: linear-gradient(to bottom right, #555, #222);
            border-radius: 20px;
            padding: 1.5px;
            overflow: hidden;
        }

        /* Animated Border Glow */
        .container_chat_bot .container-chat-options::after {
            position: absolute;
            content: "";
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
            width: 200%;
            height: 200%;
            animation: rotateGlow 4s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container_chat_bot .container-chat-options .chat {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            border-radius: 19px;
            width: 100%;
            overflow: hidden;
        }

        .container_chat_bot .chat .chat-bot textarea {
            background-color: transparent;
            border: none;
            width: 100%;
            height: 60px;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 14px;
            padding: 15px;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        .container_chat_bot .chat .chat-bot textarea::placeholder {
            color: #666;
            transition: color 0.3s ease;
        }

        .container_chat_bot .chat .chat-bot textarea:focus::placeholder {
            color: transparent;
        }

        .container_chat_bot .chat .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 15px;
        }

        .container_chat_bot .chat .options .btns-add {
            display: flex;
            gap: 12px;
        }

        .container_chat_bot .chat .options .btns-add button {
            color: #555;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: all 0.3s ease;
        }

        .container_chat_bot .chat .options .btns-add button:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .container_chat_bot .chat .options .btn-submit {
            background: linear-gradient(135deg, #444, #222);
            border: none;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            color: #888;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .container_chat_bot .chat .options .btn-submit:hover {
            color: #fff;
            transform: scale(1.1);
            background: linear-gradient(135deg, #555, #333);
        }

        .container_chat_bot .chat .options .btn-submit:active {
            transform: scale(0.9);
        }

        .container_chat_bot .tags {
            padding: 15px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .container_chat_bot .tags span {
            padding: 6px 12px;
            background-color: #1b1b1b;
            border: 1px solid #333;
            border-radius: 20px;
            cursor: pointer;
            color: #ccc;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .container_chat_bot .tags span:hover {
            background-color: #252525;
            border-color: #555;
            color: #fff;
        }
    </style>
</head>
<body>
    
<div class="container_chat_bot">
  <div class="container-chat-options">
    <div class="chat">
      <div class="chat-bot">
        <textarea id="chat_bot" placeholder="Imagine Something...✦˚"></textarea>
      </div>
      <div class="options">
        <div class="btns-add">
          <button title="Attach file">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>
          <button title="Plugins">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </button>
        </div>
        <button class="btn-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="tags">
    <span>Create Image</span>
    <span>Analyze Data</span>
    <span>Summarize</span>
  </div>
</div>

</body>
</html>
